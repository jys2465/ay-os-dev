const EMP_LBL={name:'이름',no:'사번',pos:'직위',job:'직무',org:'소속',corp:'법인',email:'이메일',phone:'연락처',kind:'고용 형태',gjoin:'그룹 입사일',join:'자사 입사일',status:'재직 상태',leave:'퇴사일'};
const EMP_SHOW={pos:posName,org:orgPath,corp:corpShort};
function empApply(e,n,isNew){
  if(isNew){ const r={id:uid('EM'),...n,hist:[{d:n.join||TODAY,k:'등록',v:`${orgPath(n.org)} · ${posName(n.pos)}`,by:S.user.name}]}; T('emp').push(r); audit('emp',r.id,'등록',`${n.name} (${n.no})`); return r }
  const ch=[]; for(const k of Object.keys(n)){ const a=k==='job'?jobOf(e):(e[k]||''), b=n[k]||''; if(String(a)!==String(b)){ const sh=EMP_SHOW[k]||(x=>x); ch.push(`${EMP_LBL[k]}: ${sh(a)||'-'} → ${sh(b)||'-'}`); e[k]=b } }
  if(!ch.length) return e;
  if(n.job!==undefined&&e.duty&&!byId('duty',e.duty)) delete e.duty;   /* 이관 때 직무가 들어가 있던 칸 정리 */
  (e.hist||(e.hist=[])).push({d:TODAY,k:'정보 수정',v:ch.join(' · '),by:S.user.name}); audit('emp',e.id,'정보 수정',`${e.name}: `+ch.join(' · '));
  if(e.status==='퇴사'){ const u=userOfEmp(e.id); if(u&&u.on){ u.on=false; audit('user',u.id,'사용 중지','퇴사 처리') } }
  return e }

/* 엑셀 일괄 수정: 첫 줄 제목(직원 명부 엑셀과 같은 모양), 사번으로 맞춤, 빈칸은 바꾸지 않음 */
function bulkPreview(A,done){
  const H=(A[0]||[]).map(x=>String(x||'').trim()), col=l=>H.indexOf(l);
  if(col('사번')<0) return toast('첫 줄에 "사번" 제목이 있어야 합니다. 엑셀 받기로 받은 파일 모양을 쓰세요.');
  const MAP=[['이름','name'],['직무','job'],['이메일','email'],['연락처','phone'],['그룹 입사일','gjoin'],['자사 입사일','join'],['고용 형태','kind'],['직위','pos'],['법인','corp']];
  const posBy=n=>T('pos').find(p=>p.name===n)?.id, corpBy=n=>T('corp').find(c=>c.short===n||c.name===n)?.id;
  const dt=v=>{ v=String(v||'').trim(); if(!v) return ''; let m=v.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`; m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`} if(/^\d{8}$/.test(v)) return v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6); return null };
  const plan=[], bad=[];
  for(let i=1;i<A.length;i++){ const row=A[i]||[], no=String(row[col('사번')]||'').trim(); if(!no) continue;
    const e=T('emp').find(x=>String(x.no)===no); if(!e){ bad.push(`${i+1}행: 사번 ${no} 없음`); continue }
    const n={}; for(const [l,k] of MAP){ const c=col(l); if(c<0) continue; let v=String(row[c]??'').trim(); if(!v) continue;
      if(k==='gjoin'||k==='join'){ const d=dt(v); if(d===null){ bad.push(`${i+1}행 ${l}: 날짜 형식 확인 (${v})`); continue } v=d }
      if(k==='email') v=v.toLowerCase().split('@')[0];
      if(k==='pos'){ const id=posBy(v); if(!id){ bad.push(`${i+1}행 직위 '${v}' 없음`); continue } v=id }
      if(k==='corp'){ const id=corpBy(v); if(!id){ bad.push(`${i+1}행 법인 '${v}' 없음`); continue } v=id }
      const cur=k==='job'?jobOf(e):(e[k]||''); if(String(cur)!==String(v)) n[k]=v }
    if(Object.keys(n).length) plan.push([e,n]) }
  modal(`<h2>엑셀 일괄 수정 미리보기</h2>
   <p class="pmeta" style="font-size:13px">사번으로 맞춰 <b>바뀌는 칸만</b> 반영합니다. 엑셀의 빈칸은 그대로 둡니다. (소속 · 재직 상태는 한 사람씩 또는 조직도에서)</p>
   <div class="tbl" style="max-height:340px;overflow:auto"><table><thead><tr><th>사번</th><th>이름</th><th>바뀌는 내용</th></tr></thead><tbody>${plan.map(([e,n])=>`<tr><td class="num">${esc(e.no)}</td><td>${esc(e.name)}</td><td>${Object.entries(n).map(([k,v])=>`${EMP_LBL[k]}: ${esc((EMP_SHOW[k]||(x=>x))(k==='job'?jobOf(e):e[k]||'')||'-')} → <b>${esc((EMP_SHOW[k]||(x=>x))(v))}</b>`).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="3" class="note">바뀌는 내용이 없습니다</td></tr>'}</tbody></table></div>
   ${bad.length?`<div class="msg s-urg" style="margin-top:8px;max-height:120px;overflow:auto">반영하지 않는 줄 ${bad.length}개<br>${bad.slice(0,30).map(esc).join('<br>')}</div>`:''}
   <div class="actions"><button type="button" class="btn" data-x>취소</button><button class="btn pri" ${plan.length?'':'disabled'}>${plan.length}명 반영</button></div>`,(f,d)=>{
    f.onsubmit=ev=>{ ev.preventDefault(); for(const [e,n] of plan) empApply(e,n,false); audit('emp','-','엑셀 일괄 수정',plan.length+'명'); save(); d.remove(); toast(plan.length+'명을 반영했습니다.'); done&&done() } },true) }
/* =====================================================================
   메뉴 구성 (v1.5.0)
   - 조직관리 4 · 재고관리 8 · 계약관리 3 — 묶음 아래 한 단계로만
   - 재고관리는 하루 업무 순서: 오늘 할 일 → 매일 업로드 → 입고 관리(발주 · 입고 | 단가 · 소비기한) → 현재고 · 발주 권고
     → 소비기한 → 월간 수불 · 실적(재고 수불부 | 브랜드별 실적 | 기타출고) → 재고 조정 · 실사 → 품목 기준정보
   - 합친 메뉴는 원래 권한 중 하나만 있어도 보이고, 안의 탭은 원래 권한 키(invcost · invbr)로 보임 여부를 정함
   - 모바일 아래 탭: 할 일 · 재고 · 조직 · 더보기
   - 개발중 메뉴: 개발기에서만 보임 · 운영기에서는 메뉴와 화면 모두 막음
   - 권한 키는 04_inventory_security.sql 의 역할(perm)과 같음 · 처리 종류에 '엑셀' 추가
   ===================================================================== */
if(!ACTS.includes('엑셀')) ACTS.push('엑셀');
/* 합친 메뉴 권한: 입고 관리 = 발주(invpo) 또는 입고 단가(invcost), 월간 수불 · 실적 = 수불부 · 브랜드 실적 · 품목 일별 중 하나 */
const canRaw=can, MERGEP={invpo:['invpo','invcost'],invbook:['invbook','invbr','invday'],invup:['invup','invman']};
can=function(menu,act='조회'){ const L=MERGEP[menu]; return L?L.some(k=>canRaw(k,act)):canRaw(menu,act) };
const IS_PROD=ENV==='prod';
MENU_PERM.data='cfg';
(function(){
  const old=MENU.slice(), by=k=>old.find(m=>m.k===k);
  const pick=(k,o={})=>{const m=by(k); if(!m) return null; const x={...m,...o}; delete x.p; return x};
  const PC_ONLY=new Set(['invup','invbook','invadj','invmst','user','data','ctlabor','ctsupply','ctco']);
  const INVK=['invrep','invstk','invbr','invexp','invbook','invup','invcost','invadj','invpo','invmst','ctlabor','ctsupply','ctco'];
  const LIVE=[
    {g:'조직관리'},
    {k:'orgchart',n:'조직도'}, {k:'people',n:'직원 명부',tab:'조직',tabo:3}, pick('user',{n:'권한 관리'}), {k:'data',n:'변경 이력 · 백업'},
    {g:'재고관리'},
    {k:'invrep',n:'오늘 할 일',tab:'할 일',tabo:1}, {k:'invup',n:'매일 업로드'}, {k:'invpo',n:'입고 관리'},
    {k:'invstk',n:'현재고 · 발주 권고',tab:'재고',tabo:2}, {k:'invexp',n:'소비기한 관리'},
    {k:'invbook',n:'월간 수불 · 실적'}, {k:'invadj',n:'재고 조정 · 실사'}, {k:'invmst',n:'품목 기준정보'},
    {g:'계약관리'},
    {k:'ctlabor',n:'노무 계약서'},{k:'ctsupply',n:'상품공급 계약서'},{k:'ctco',n:'계약 설정 (법인 · 로고)'}
  ].filter(Boolean);
  const used=new Set(LIVE.filter(m=>m.k).map(m=>m.k));
  /* 나머지는 원래 순서대로 '개발중 · 원래 묶음' 아래로 (권한 관리 안의 역할 · 부서 권한, 데이터 관리 안의 변경 이력 · 설정은 탭으로 옮겨 뺌) */
  const INTAB=new Set(['role','grant','audit','cfg','signup','invcost','invbr','invday','invman']);
  const DEV=[]; let pend={g:'개발중 · 홈',dev:true};
  for(const m of old){
    if(m.g){ pend={g:'개발중 · '+(m.g==='재고'?'재고 원장':m.g),dev:true}; continue }
    if(m.ext||used.has(m.k)||INTAB.has(m.k)) continue;
    if(pend){ DEV.push(pend); pend=null }
    const x={...m,dev:true}; if(x.k==='emp') x.n='직원 (기존 화면)'; if(x.k==='org') x.n='조직 목록 · 상세'; if(x.p&&used.has(x.p)) delete x.p; delete x.tab; DEV.push(x) }
  MENU.splice(0,MENU.length,...LIVE,...(IS_PROD?[]:DEV));
  if(!IS_PROD&&!lsGet('ayon.fold')) DEV.filter(m=>m.g).forEach(m=>S.fold.add('g:'+m.g));   /* 개발중 묶음은 처음엔 접어 둠 */
  for(const k of INVK) VIEWS[k]=el=>INV.show(k,el);
  /* v1.4 메뉴 키로 들어오면 합친 메뉴의 해당 탭으로 */
  const OLDK={invcost:['invpo','cost'],invbr:['invbook','brand'],invday:['invbook','book'],invman:['invup','manual']};
  /* 메뉴에 없는 화면(운영기의 개발중 화면)이나 로그인 직후 '홈'이면 첫 메뉴로 */
  const _rv=renderView;
  renderView=function(){ const u=S.user; if(OLDK[S.view]){ const [k,t]=OLDK[S.view]; S.view=k; try{INV.setTab(k,t)}catch(e){} } const v=S.view;
    if(u&&!u.ext&&v!=='more'){

/* =====================================================================
   v1.12.0 업무 허브 (협업 › 업무 허브)
   - 요청 업무: 디자인 2팀 허브(클로드 아티팩트) 화면을 그대로 넣고, 저장 · 로그인만 에이온으로 바꿈

         에이온 DB(wk_cfg · wk_members · wk_brands · wk_products · wk_works · wk_me)에 연결
       · 기록 id = 부서id~원래id, data.dept = 부서id → 부서마다 따로 · 파일은 링크만(업로드 없음)

   - 권한: 사내 직원 누구나 메뉴 조회 · 저장(SQL 규칙의 기본 = 사내 직원), 부서 설정은 그 부서 팀장 · 파트장 또는 시스템 관리자
   ===================================================================== */
const HUBD={dept:'',tab:'req',frame:null,api:null,wk:'',fd:''};
const hubDepts=()=>{ const c=byId('wk_cfg','_depts'); const L=c&&Array.isArray(c.list)?c.list:T('org').filter(o=>/^디자인\s?[1-3]팀$/.test(o.name||'')).map(o=>o.id); return L.filter(id=>byId('org',id)) };

/* 허브가 쓰는 클로드 저장소 모양(doc · collection · where · onSnapshot · set · update · delete)을 에이온 DB로 */
function hubApi(dept){
  const LS=[], tb=c=>'wk_'+c, pre=dept+'~';
  const rows=c=>T(tb(c)).filter(r=>r.dept===dept);
  const strip=r=>{ const o=JSON.parse(JSON.stringify(r)); delete o.dept; delete o.id; return o };
  const did=r=>String(r.id).slice(pre.length);
  const ok=(r,F)=>F.every(([f,op,v])=>{ const x=r[f]; return op==='=='?x===v:op==='!='?x!==v:op==='>='?(x!=null&&x>=v):op==='<='?(x!=null&&x<=v):op==='>'?(x!=null&&x>v):op==='<'?(x!=null&&x<v):op==='in'?(Array.isArray(v)&&v.includes(x)):true });
  const snapQ=(c,F)=>{ const L=rows(c).filter(r=>ok(r,F)), docs=L.map(r=>({id:did(r),exists:true,data:()=>strip(r)})); return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false},forEach:f=>docs.forEach(f)} };
  const snapD=(c,id)=>{ const r=byId(tb(c),pre+id); return {id,exists:!!r,data:()=>r?strip(r):undefined,metadata:{fromCache:false}} };
  const fire=()=>LS.forEach(l=>{ const s=l.id!=null?snapD(l.c,l.id):snapQ(l.c,l.F); const sig=JSON.stringify(l.id!=null?(s.exists?s.data():null):s.docs.map(d=>[d.id,d.data()])); if(sig===l.last) return; l.last=sig; try{ l.fn(s) }catch(e){ console.error(e) } });
  const write=(c,id,d,mode)=>{ const arr=T(tb(c)), rid=pre+id, i=arr.findIndex(r=>r.id===rid);
    if(mode==='delete'){ if(i>=0) arr.splice(i,1) }
    else { if(mode==='update'&&i<0) throw {code:'not_found',message:'없는 기록'}; const rec={...(mode==='update'?arr[i]:{}),...JSON.parse(JSON.stringify(d||{})),id:rid,dept}; if(i>=0) arr[i]=rec; else arr.push(rec) }
    save(); setTimeout(fire,0) };
  const listen=l=>{ LS.push(l); setTimeout(fire,0); return ()=>{ const i=LS.indexOf(l); if(i>=0) LS.splice(i,1) } };
  const ref=(c,id)=>({id,set:async d=>write(c,id,d,'set'),update:async d=>write(c,id,d,'update'),delete:async()=>write(c,id,null,'delete'),get:async()=>snapD(c,id),onSnapshot:fn=>listen({c,id,fn})});
  const q=(c,F)=>({where:(f,op,v)=>q(c,F.concat([[f,op,v]])),doc:id=>ref(c,id),get:async()=>snapQ(c,F),onSnapshot:fn=>listen({c,F,fn})});
  const db={doc:p=>{ const [c,...r]=String(p).split('/'); return ref(c,r.join('/')) },collection:c=>q(c,[])};
  const nm=()=>{ const e=S.user&&byId('emp',S.user.emp); return (e&&e.name)||S.user?.name||S.user?.id||'' };
  const user={me:async()=>({id:'u_'+(S.user?.id||''),email:hubEmail(),name:nm(),avatarUrl:'',canEdit:hubLead(dept)}),id:async()=>'u_'+(S.user?.id||''),
    can:async()=>true,isOwner:()=>isAdmin(),canEdit:()=>hubLead(dept),profiles:async()=>({})};
  const downloads={save:async({filename,data})=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data])); a.download=filename||'file'; document.body.append(a); a.click(); a.remove(); return {saved:true} }};
  return {fire,claude:{use:n=>Promise.resolve(n==='db'?db:n==='user'?user:n==='downloads'?downloads:null)}};
}

/* 주간 업무 */
const isoWeek=d=>{ const t=new Date(d+'T00:00:00'); const day=(t.getDay()+6)%7; t.setDate(t.getDate()-day+3); const f=new Date(t.getFullYear(),0,4); const w=1+Math.round(((t-f)/864e5-3+((f.getDay()+6)%7))/7); return t.getFullYear()+'-W'+String(w).padStart(2,'0') };
const wkMon=w=>{ const [y,n]=w.split('-W').map(Number); const j=new Date(y,0,4), m=new Date(j); m.setDate(j.getDate()-((j.getDay()+6)%7)+(n-1)*7); const p=x=>String(x).padStart(2,'0'); return m.getFullYear()+'-'+p(m.getMonth()+1)+'-'+p(m.getDate()) };
const wkAdd=(d,n)=>{ const t=new Date(d+'T00:00:00'); t.setDate(t.getDate()+n); const p=x=>String(x).padStart(2,'0'); return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate()) };

    ${cand.length?`<div class="tw"><table class="t"><thead><tr><th>이름</th><th>직무</th><th>역할</th><th></th></tr></thead><tbody>${cand.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.duty||'')}</td><td><select data-er="${esc(e.id)}">${RL.map(([k,l])=>`<option value="${k}" ${k==='designer'?'selected':''}>${esc(rn[k]||l)}</option>`).join('')}</select></td><td><input type="checkbox" data-ec="${esc(e.id)}" checked></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn pri" id="hbMA">고른 직원 추가</button></div>`:'<p class="pmeta">모두 허브에 있습니다.</p>'}

  ${adm&&d?`<div class="panel"><div class="bd"><h3 style="margin:0 0 8px">허브 데이터 가져오기 <span class="pmeta">클로드 아티팩트 허브에서 옮긴 JSON 파일 · ${esc(hubName(d))}에 넣음 · 같은 id는 덮어씀</span></h3>
    <input type="file" id="hbIm" accept=".json"><p class="pmeta" id="hbImR"></p></div></div>`:''}`;
  const sv=(id,o,merge)=>{ const arr=T('wk_cfg'), i=arr.findIndex(r=>r.id===id), rec={...(merge&&i>=0?arr[i]:{}),...o,id}; if(i>=0) arr[i]=rec; else arr.push(rec); save() };
  const os=$('#hbOS',B); if(os) os.onclick=()=>{ sv('_depts',{list:$$('[data-od]',B).filter(x=>x.checked).map(x=>x.dataset.od)}); audit('cfg','업무 허브','사용 부서 변경',''); toast('사용 부서를 저장했습니다.'); renderView() };
  const rs=$('#hbRS',B); if(rs) rs.onclick=()=>{ const o={}; $$('[data-rn]',B).forEach(i=>{ if(i.value.trim()) o[i.dataset.rn]=i.value.trim() }); sv(d+'~team',{roleNames:o,dept:d},true); toast('역할 이름을 저장했습니다.') };
  const addM=(e,role)=>{ const id=d+'~m_'+e.id; if(byId('wk_members',id)) return 0; T('wk_members').push({id,dept:d,name:e.name,email:hubNE(e.email),role,part:'',team:role==='marketer'||role==='viewer'?(orgPath(e.org||'').split(' > ').pop()||''):'',active:true,brands:[],order:999,updatedAt:new Date().toISOString()}); return 1 };
  const ma=$('#hbMA',B); if(ma) ma.onclick=()=>{ let n=0; $$('[data-ec]',B).forEach(c=>{ if(!c.checked) return; const e=byId('emp',c.dataset.ec); const r=$(`[data-er="${CSS.escape(c.dataset.ec)}"]`,B).value; n+=addM(e,r) }); save(); toast(`${n}명을 추가했습니다. 파트 · 담당 브랜드는 요청 업무 › 인원 현황에서 정합니다.`); hubSet(B,d) };
  const oa=$('#hbOA',B); if(oa) oa.onclick=()=>{ const v=$('#hbOQ',B).value.split(' · ')[0].trim(); const e=T('emp').find(x=>x.name===v&&x.status!=='퇴사'&&x.email); if(!e) return toast('직원을 목록에서 골라 주세요.'); if(addM(e,$('#hbOR',B).value)){ save(); toast(e.name+'님을 추가했습니다.'); hubSet(B,d) } else toast('이미 있습니다.') };
  const ba=$('#hbBA',B); if(ba) ba.onclick=()=>{ let n=0; $$('[data-bn]',B).forEach(c=>{ if(!c.checked||c.disabled) return; const nm=c.dataset.bn, id=d+'~b_'+Array.from(nm).reduce((h,ch)=>(h*31+ch.charCodeAt(0))>>>0,7).toString(36); if(byId('wk_brands',id)) return; T('wk_brands').push({id,dept:d,name:nm,color:'#8a949e',order:99,part:''}); n++ }); save(); toast(`브랜드 ${n}개를 추가했습니다. 제품은 요청 업무 › 설정에서 넣습니다.`); hubSet(B,d) };
  const im=$('#hbIm',B); if(im) im.onchange=async()=>{ const f=im.files[0]; if(!f) return; let J; try{ J=JSON.parse(await f.text()) }catch(e){ return toast('JSON 파일이 아닙니다.') }
    const cols=['cfg','members','brands','products','works','me'], cnt={}; let n=0;
    for(const c of cols){ const src=J[c]; if(!src) continue; const ent=c==='cfg'?[['team',src]]:Object.entries(src);
      for(const [id,data] of ent){ const t='wk_'+c, rid=d+'~'+id, arr=T(t), i=arr.findIndex(r=>r.id===rid), rec={...data,id:rid,dept:d}; if(c==='cfg'){ const old=i>=0?arr[i]:{}; if(old.roleNames&&!rec.roleNames) rec.roleNames=old.roleNames } if(i>=0) arr[i]=rec; else arr.push(rec); cnt[c]=(cnt[c]||0)+1; n++ } }
    save(); audit('cfg','업무 허브','허브 데이터 가져오기',`${hubName(d)} ${n}건`); $('#hbImR',B).textContent=`가져옴: ${Object.entries(cnt).map(([k,v])=>k+' '+v).join(' · ')} (총 ${n}건)`; toast('허브 데이터를 가져왔습니다.') };

/* =====================================================================
   운영기 → 개발기 데이터 가져오기 (개발기에서만 · 시스템 관리자만)
   - 개발기 config.js 에 prodUrl · prodAnonKey(운영기 공개키)가 있어야 메뉴가 보임
   - 운영기에는 관리자 본인 계정으로 '읽기만' 함 (운영기 데이터는 바꾸지 않음)
   - 개발기는 운영기와 똑같아지도록 덮어쓰고, 운영기에 없는 기록은 지움 (변경 이력 · 본인 계정 제외)
   - 시작 전에 개발기 전체를 JSON 파일로 내려받아 둠
   ===================================================================== */
if(CLOUD&&ENV==='dev'&&CFG.prodUrl&&CFG.prodAnonKey){
  /* 메뉴는 조직관리 › 데이터 관리 의 탭으로 (inv_menu.js) */
  VIEWS.pull=el=>{
    if(!isAdmin()) return noPerm(el,'운영기 데이터 가져오기');
    const cnt={}; for(const [k,v] of Object.entries(DB)) if(Array.isArray(v)) cnt[k]=v.length;
    el.innerHTML=head('운영기 데이터 가져오기','시스템 · 개발기 전용','')+`<div class="panel"><div class="bd">
     <p style="margin:0 0 10px">운영기의 데이터를 그대로 가져와 <b>개발기를 운영기와 똑같이</b> 맞춥니다. 운영기 데이터는 읽기만 하고 바꾸지 않습니다.</p>
     <ul style="margin:0 0 14px;padding-left:18px;font-size:13px;line-height:1.8">
      <li>개발기에서 시험으로 넣거나 고친 기록은 운영기 값으로 <b>덮어써지고</b>, 운영기에 없는 기록은 <b>지워집니다</b>.</li>
      <li>시작 전에 지금 개발기 데이터를 백업 파일(JSON)로 내려받습니다.</li>
      <li>로그인 계정(이메일 · 비밀번호)은 서버마다 따로라서 가져오지 않습니다. 개발기에서 로그인할 사람은 개발기 Supabase에 계정이 있어야 합니다.</li>
      <li>운영기 주소: <code>${esc(CFG.prodUrl)}</code></li></ul>
     <form class="form" id="pf" style="max-width:420px" autocomplete="off">
      <label for="ppw">운영기 비밀번호 <span class="pmeta">(${esc(S.user.id)}@gcway.com · 운영기 시스템 관리자여야 함)</span><input id="ppw" type="password" autocomplete="off" required></label>
      <div class="actions" style="justify-content:flex-start"><button class="btn pri" id="pgo">운영기 데이터 가져오기</button></div></form>
     <div id="plog" class="pmeta" style="margin-top:12px;white-space:pre-wrap;font-size:13px;color:var(--fg)"></div>
     <p class="pmeta" style="margin-top:12px">지금 개발기: ${Object.entries(cnt).filter(([,n])=>n).map(([k,n])=>`${esc(k)} ${n}`).join(' · ')}</p></div></div>`;
    const log=t=>{ $('#plog',el).textContent+=t+'\n' };
    $('#pf',el).onsubmit=e=>{ e.preventDefault(); const pw=$('#ppw',el).value; if(!pw) return;
      ask('개발기를 운영기 데이터로 덮어씁니다','개발기에서 시험으로 바꾼 내용은 사라집니다 (백업 파일은 먼저 내려받습니다). 계속할까요?','가져오기',()=>pull(pw)) };
    async function pull(pw){ const btn=$('#pgo',el); btn.disabled=true; $('#plog',el).textContent=''; let P=null;
      try{
        log('1/5 운영기 로그인…');
        P=window.supabase.createClient(CFG.prodUrl,CFG.prodAnonKey,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'ayon.auth.pull'}});
        const {error:le}=await P.auth.signInWithPassword({email:loginEmail(S.user.id),password:pw}); if(le) throw new Error('운영기 로그인 실패: '+(/invalid/i.test(le.message)?'비밀번호를 확인하세요':le.message));
        log('2/5 운영기 데이터 읽기…');
        const read=async c=>{ const out=[]; for(let f=0;;f+=1000){ const {data,error}=await c.from('ayon_records').select('tbl,id,data').order('tbl').order('id').range(f,f+999); if(error) throw error; out.push(...data); if(data.length<1000) break } return out };
        const prod=await read(P);
        const pu=prod.find(r=>r.tbl==='user'&&r.id===S.user.id);
        if(!pu||!(pu.data.roles||[]).includes('R-ADMIN')) throw new Error('운영기에서 이 계정이 시스템 관리자가 아니라 전체 데이터를 읽을 수 없습니다. 중단했습니다.');
        log(`   운영기 ${prod.length.toLocaleString()}건`);
        log('3/5 개발기 백업 파일 내려받기…');
        const dev=await read(SB);
        const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify({at:STAMP(),env:'dev',rows:dev})],{type:'application/json'}));
        a.download=`ayon_dev_backup_${TODAY}_${nowHM().replace(':','')}.json`; document.body.append(a); a.click(); a.remove();
        log(`   개발기 ${dev.length.toLocaleString()}건 백업`);
        log('4/5 개발기에 쓰기…');
        if(_rt){ SB.removeChannel(_rt); _rt=null }
        const K=r=>r.tbl+SEP+r.id, dm=new Map(dev.map(r=>[K(r),JSON.stringify(r.data)])), pk=new Set(prod.map(K));
        const ups=prod.filter(r=>r.tbl!=='audit'&&dm.get(K(r))!==JSON.stringify(r.data));
        const aud=prod.filter(r=>r.tbl==='audit'&&!dm.has(K(r)));
        /* 계정은 마지막에(관리자 보호 규칙), 나머지 먼저 */
        ups.sort((x,y)=>(x.tbl==='user')-(y.tbl==='user'));
        for(let i=0;i<ups.length;i+=300){ const {error}=await SB.from('ayon_records').upsert(ups.slice(i,i+300).map(({tbl,id,data})=>({tbl,id,data})),{onConflict:'tbl,id'}); if(error) throw error; log(`   바뀐 기록 ${Math.min(i+300,ups.length)}/${ups.length}`) }
        for(let i=0;i<aud.length;i+=500){ const {error}=await SB.from('ayon_records').upsert(aud.slice(i,i+500).map(({tbl,id,data})=>({tbl,id,data})),{onConflict:'tbl,id',ignoreDuplicates:true}); if(error) throw error }
        const dels={}; for(const r of dev){ if(r.tbl==='audit'||pk.has(K(r))) continue; if(r.tbl==='user'&&r.id===S.user.id) continue; (dels[r.tbl]||(dels[r.tbl]=[])).push(r.id) }
        let nd=0; for(const [t,ids] of Object.entries(dels)) for(let i=0;i<ids.length;i+=200){ const {error}=await SB.from('ayon_records').delete().eq('tbl',t).in('id',ids.slice(i,i+200)); if(error) throw error; nd+=Math.min(200,ids.length-i) }
        log(`   바뀜 ${ups.length.toLocaleString()} · 변경 이력 추가 ${aud.length.toLocaleString()} · 지움 ${nd.toLocaleString()}`);
        log('5/5 화면 다시 불러오기…');
        await cloudLoad(); cloudRealtime();
        const me=T('user').find(x=>x.id===S.user.id&&x.on); if(me) S.user={...S.user,...me};
        audit('cfg','-','운영기 데이터 가져오기',`바뀜 ${ups.length} · 지움 ${nd}`); save();
        toast('운영기 데이터를 가져왔습니다.'); log('완료');
        setTimeout(()=>renderApp(),600);
      }catch(err){ console.error(err); log('중단: '+(err.message||err)); toast('가져오지 못했습니다: '+(err.message||err)); if(!_rt) cloudRealtime() }
      finally{ try{ P&&await P.auth.signOut() }catch(e){} btn.disabled=false } }
  };
}
/* =====================================================================

/* =====================================================================

(function(){

    const hr=t.tHead&&t.tHead.rows[t.tHead.rows.length-1]; if(!hr||[...hr.cells].some(c=>c.colSpan>1||c.rowSpan>1))return; t.dataset.tx=1;

        rows.sort((a,b)=>{const x=val(a),y=val(b);const r=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'ko',{numeric:true});return dir==='asc'?r:-r}).forEach(r=>tb.appendChild(r)) };

  function foot(t){ if(!t.dataset.tx)return; const hr=t.tHead.rows[t.tHead.rows.length-1], tb=t.tBodies[0]; if(!tb)return;
