<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AY-ON 에이온</title><meta name="description" content="주식회사 아연 업무 포털 에이온">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Sora:wght@300;500;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=1.12.0"></script>
<style>

/* Layout: 개발기 띠 → 상단바(로고 · 중앙 PC/모바일 전환 · 사용자) → 좌측 메뉴 + 본문 / 모바일은 폭 420 프레임 + 하단 탭 */
:root{
  --navy:#16233F; --navy-2:#24345A; --accent:#E4572E; --accent-soft:#FDEEE8;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F7F8FB; --line:#DDE2EA; --fg:#1B2233; --muted:#5E6878; --faint:#8A93A3;
  --ok:#2E7D5B; --ok-soft:#E6F3EC; --warn:#B7791F; --warn-soft:#FBF1DE; --bad:#C2372B; --bad-soft:#FBE7E5; --info:#2F5DA8; --info-soft:#E7EEF9;
  --dev:#C2372B;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0E1729; --navy-2:#1C2A47; --accent:#F0704A; --accent-soft:#3A2420;
  --bg:#0F1420; --surface:#171E2D; --surface-2:#1C2435; --line:#2A3448; --fg:#E7EBF2; --muted:#A3ADBF; --faint:#7C879B;
  --ok:#5CC08F; --ok-soft:#183126; --warn:#E3AE58; --warn-soft:#352A16; --bad:#F07A6E; --bad-soft:#3A1E1C; --info:#79A3E8; --info-soft:#1B2840; --dev:#D9483B; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0E1729; --navy-2:#1C2A47; --accent:#F0704A; --accent-soft:#3A2420;
  --bg:#0F1420; --surface:#171E2D; --surface-2:#1C2435; --line:#2A3448; --fg:#E7EBF2; --muted:#A3ADBF; --faint:#7C879B;
  --ok:#5CC08F; --ok-soft:#183126; --warn:#E3AE58; --warn-soft:#352A16; --bad:#F07A6E; --bad-soft:#3A1E1C; --info:#79A3E8; --info-soft:#1B2840; --dev:#D9483B; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--dev)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* dev banner */
.devbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--dev);color:#fff;font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:5px}
.devbar b{letter-spacing:.06em}
.devbar label{display:flex;gap:6px;align-items:center;margin-left:auto;cursor:pointer}
.devbar .sep{opacity:.6}

/* login */
.login{min-height:calc(100% - 30px);display:grid;place-items:center;padding-block:32px}
.login-wrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,300px);gap:24px;align-items:start;width:100%;max-width:720px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.login-card{padding:32px 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.brand svg{flex:none}
.login-card h1{font-size:20px;margin:20px 0 4px;text-wrap:balance}
.login-card p.sub{color:var(--muted);margin:0 0 22px;font-size:13px}
.field{display:grid;gap:6px;margin-bottom:14px;position:relative}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-height:42px}
.inp:focus-within{border-color:var(--navy-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--info) 18%,transparent)}
.inp input{flex:1;min-width:0;border:0;background:transparent;padding:10px 12px;outline:none}
.who{margin-right:8px;background:var(--info-soft);color:var(--info);font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.eye{border:0;background:transparent;padding:8px 10px;color:var(--muted);display:grid;place-items:center}
.eye:hover{color:var(--fg)}
.recent{position:absolute;top:100%;left:0;right:0;margin-top:4px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(10,20,40,.12);padding:4px}
.recent .h{font-size:11px;color:var(--faint);padding:6px 8px 2px}
.recent button{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;background:transparent;padding:8px;border-radius:4px;text-align:left}
.recent button:hover,.recent button.on{background:var(--surface-2)}
.recent .x{color:var(--faint);font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:700;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.block{width:100%;padding:11px}
.msg{font-size:12px;margin:-4px 0 12px;min-height:18px}
.msg.err{color:var(--bad)} .msg.info{color:var(--info)}
.demo{padding:20px}
.demo h2{font-size:13px;margin:0 0 4px}
.demo p{color:var(--muted);font-size:12px;margin:0 0 12px}
.demo table{width:100%;border-collapse:collapse;font-size:12px}
.demo td{padding:7px 4px;border-top:1px solid var(--line)}
.demo td:first-child{font-family:var(--f-num)}
.demo button{border:0;background:none;color:var(--info);font-weight:700;font-size:12px;padding:0}

/* app shell */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 27px);z-index:40;background:var(--navy);color:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:8px}
.top .brand{color:#fff;font-size:14px}
.seg{justify-self:center;display:inline-flex;background:rgba(255,255,255,.1);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;color:#C9D1DF;padding:5px 16px;border-radius:99px;font-size:12px;font-weight:700}
.seg button.on{background:var(--accent);color:#fff}
.me{justify-self:end;display:flex;align-items:center;gap:10px;font-size:12px}
.me .role{background:rgba(255,255,255,.12);padding:2px 8px;border-radius:99px}
.me button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px}
.idle{color:#C9D1DF;font-size:11px}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100% - 80px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:11px;color:var(--faint);padding:12px 10px 4px;letter-spacing:.04em}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:6px;font-weight:500;color:var(--fg)}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav.sub{padding-left:22px;font-size:13px}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--surface-2);color:var(--faint);border:1px solid var(--line);white-space:nowrap}
.tag.p1{background:var(--accent);color:#fff;border-color:var(--accent)}
.main{padding-block:22px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.ph h1{font-size:22px;margin:0;text-wrap:balance}
.ph .eb{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.ph .meta{color:var(--muted);font-size:12px}

/* mobile mode */
.mobile .shell{grid-template-columns:minmax(0,1fr);justify-items:center;background:var(--bg)}
.mobile .side{display:none}
.mobile .main{width:100%;max-width:420px;padding-bottom:84px}
.mobile .top{grid-template-columns:auto 1fr auto}
.mobile .top .brand span{display:none}
.mobile .me .nm,.mobile .me .idle{display:none}
.tabbar{display:none}
.mobile .tabbar{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;border:0;background:transparent;padding:9px 2px 8px;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tabbar button.on{color:var(--accent);font-weight:700}
.tabbar i{font-style:normal;width:22px;height:4px;border-radius:2px;background:currentColor;opacity:.5}
.tabbar .on i{opacity:1}
@media (min-width:700px){.mobile .main{border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--bg);min-height:100%}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left}
button.kpi:hover{border-color:var(--muted)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-num);font-size:24px;font-weight:500;line-height:1.2;margin-top:4px}
.kpi .s{font-size:11px;color:var(--faint)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.mobile .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.mobile .grid2{grid-template-columns:minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel>.hd h2{font-size:14px;margin:0}
.panel>.bd{padding:12px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:11px;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t .c{text-align:center}
.t .nw{white-space:nowrap}
.t small{color:var(--faint);display:block;font-size:11px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.done{background:var(--info-soft);color:var(--info)} .pill.mute{background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.bar{height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden;min-width:70px}
.bar>span{display:block;height:100%;background:var(--navy-2)}
.bar.ok>span{background:var(--ok)} .bar.warn>span{background:var(--warn)} .bar.bad>span{background:var(--bad)} .bar.done>span{background:var(--info)}
.pg{display:flex;align-items:center;gap:8px}
.pg .num{font-size:12px;width:34px;text-align:right}

/* mobile list rendering of table */
.mlist{display:none}
.mobile .tw.hasm{display:none}
.mobile .mlist{display:grid;gap:8px;padding:10px}
.mi{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface);text-align:left;display:grid;gap:6px;width:100%}
.mi .r{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.mi b{font-size:13px;color:var(--fg)}

/* dept */
.depts{display:grid;gap:8px}
.dept{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:left;width:100%}
.dept:hover{border-color:var(--muted)}
.dept b{font-size:13px}
.dept .lead{font-size:11px;color:var(--faint)}
.dept .last{grid-column:1/-1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dept.none{border-style:dashed}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.45);z-index:70;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(520px,100%);height:100%;background:var(--surface);overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;display:grid;align-content:start;gap:16px}
.modal{width:min(440px,100%);background:var(--surface);border-radius:10px;padding:22px;display:grid;gap:12px;max-height:100%;overflow:auto}
.drawer h2,.modal h2{font-size:17px;margin:0;text-wrap:balance}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl .it{position:relative;padding:0 0 14px 16px;font-size:13px}
.tl .it::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--navy-2)}
.tl .it.last::before{border-color:var(--accent);background:var(--accent)}
.tl .when{font-size:11px;color:var(--faint)}
.form{display:grid;gap:10px}
.form label{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:4px}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);font-weight:400;color:var(--fg);width:100%}
.form textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:90;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.count{font-family:var(--f-num);font-size:40px;text-align:center;color:var(--accent)}

/* placeholder */
.wip{display:grid;place-items:center;text-align:center;padding:64px 16px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);gap:8px}
.wip .ic{width:48px;height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--faint);font-weight:800}
.wip h2{margin:0;font-size:18px}
.wip p{margin:0;color:var(--muted);font-size:13px;max-width:40ch}

.note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}


.h3{font-size:13px;margin:0 0 8px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;min-width:880px}
.mobile .kan{grid-template-columns:minmax(0,1fr);min-width:0}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;gap:6px;align-content:start}
.col .ch{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 2px 4px}
.cc{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px;font-size:12px;color:var(--muted)}
.cc:hover{border-color:var(--muted)}
.cc b{color:var(--fg);font-size:13px}
.cc .ft{font-size:11px;color:var(--faint)}
.cc .pill{justify-self:start}
.empty{font-size:12px;color:var(--faint);text-align:center;padding:10px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{flex:1;min-width:64px;text-align:center;font-size:11px;padding:5px 4px;border-radius:4px;background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.steps span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ivs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-size:13px}
.ivs label{display:flex;gap:6px;align-items:center}
.big{width:170px;height:170px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-content:center;gap:4px;margin:6px 0}
.big b{font-size:22px} .big span{font-size:12px;color:#C9D1DF}
.big.done{background:var(--accent)}
.mobile .grid2[style]{grid-template-columns:minmax(0,1fr)!important}
@media (max-width:1100px){.grid2[style]{grid-template-columns:minmax(0,1fr)!important}}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree{padding:6px 0}
.tn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding-block:7px;padding-right:14px;font-size:13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
button.tn:hover{background:var(--surface-2)}
.tn .car{width:12px;color:var(--accent)}
.tn .tl2{color:var(--muted);font-size:12px}
.tn .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.tn.person{color:var(--fg);background:var(--surface-2)}


.tn .acts{display:flex;gap:6px;margin-left:8px}
.pchip{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:1px 0;white-space:nowrap}
.t.pm td,.t.pm th{padding:6px 8px}
.t.pm select{padding:4px 6px}
.btn[disabled]{cursor:not-allowed}


.sfx{color:var(--faint);font-size:13px;padding-right:10px;font-family:var(--f-num)}
.hint{font-size:11px;color:var(--faint)}
.kinds{display:grid;gap:8px}
.kind{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px}
.kind:hover{border-color:var(--accent);background:var(--accent-soft)}
.kind span{font-size:12px;color:var(--muted);font-weight:400}
.ctrow{display:flex;flex-wrap:wrap;gap:4px 14px;padding-block:4px 8px;padding-right:14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--surface)}
.ct b{color:var(--fg);font-weight:500}


.cardtop{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ph-wrap{display:grid;gap:6px;justify-items:center}
.ph-wrap img,.noph{width:96px;height:120px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.noph{display:grid;place-items:center;background:var(--surface-2);font-size:34px;font-weight:800;color:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

{\n  const p = path.split('/'); const col = p[0], id = p[1]; const d = S.demoData;\n  if (col === 'cfg') { d.cfg = mode === 'delete' ? null : mode === 'update' ? Object.assign({}, d.cfg, data) : Object.assign({}, data); return; }\n  const m = d[col]; if (!m) return;\n  if (mode === 'delete') delete m[id];\n  else if (mode === 'update') m[id] = Object.assign({}, m[id], data, { id });\n  else m[id] = Object.assign({}, data, { id });\n}\nasync function writeDoc(path, data, mode) {\n  if (S.demo) { demoWrite(path, data, mode); scheduleRender(true); return true; }\n  if (!DB) { toast('지금은 저장할 수 없어요. 로그인 상태를 확인해 주세요.', 'bad'); return false; }\n  const ref = DB.doc(path);\n  const run = () => mode === 'delete' ? ref.delete() : mode === 'update' ? ref.update(data) : ref.set(data);\n  try { await run(); return true; }\n  catch (e) {\n    let err = e;\n    if (err && err.code === 'unavailable') { await sleep(400 + Math.random() * 700); try { await run(); return true; } catch (e2) { err = e2; } }\n    const c = err && err.code;\n    const isWork = path.indexOf('works/') === 0 || path.indexOf('me/') === 0;\n    toast(c === 'invalid_argument' ? (isWork ? '저장하지 못했어요. 보기 전용 권한인지 확인해 주세요.' : '이 항목은 팀장급만 바꿀 수 있어요.')\n      : c === 'quota_exceeded' ? '허브 저장 공간이 가득 찼어요. 팀장급에게 지난 소재 정리를 요청해 주세요.'\n      : '저장하지 못했어요. 잠시 뒤 다시 해 주세요.', 'bad');\n    if (c === 'invalid_argument' && isWork && S.canWrite == null) { S.canWrite = false; scheduleRender(true); }\n    return false;\n  }\n}\nconst pushLog = (log, e) => arr(log).concat([e]).slice(-40);\nconst meId = () => { const m = linked(); return m ? m.id : null; };\nfunction statusPatch(w, k, extra) {\n  const now = iso();\n  return Object.assign({ status: k, statusAt: now, closed: k === 'done', closedAt: k === 'done' ? now : null, updatedAt: now, log: pushLog(w.log, { s: k, at: now, by: meId() }) }, extra || {});\n}\n// 다시 컨펌 요청할 때: 「컨펌 완료」는 그대로 두고 「수정 필요」였던 쪽만 다시 받아요. (둘 다 컨펌 완료로 남아 있으면 둘 다 다시)\nfunction reviewMarks(w) {\n  let mgr = w.chkMgr === 'ok', mk = w.chkMk === 'ok';\n  if (mgr && mk) { mgr = false; mk = false; }\n  const p = {};\n  if (!mgr) Object.assign(p, { chkMgr: null, chkMgrAt: null, chkMgrBy: null });\n  if (!mk) Object.assign(p, { chkMk: null, chkMkAt: null, chkMkBy: null });\n  return p;\n}\nasync function setStatus(w, k) {\n  const patch = statusPatch(w, k);\n  if (k === 'review') Object.assign(patch, reviewMarks(w), { reviewAt: patch.statusAt });\n  if (k === 'doing' && !w.start) patch.start = T;\n  if (!(await writeDoc('works/' + w.id, patch, 'update'))) return;\n  if (k === 'done') notifyBar('done', Object.assign({}, w, patch));\n  else toast('\\'' + wTitle(w) + '\\' → ' + ST[k].label);\n}\nasync function startWork(w, est, notion) {\n  const patch = statusPatch(w, 'doing', { estHours: est, estAt: iso(), start: w.start || T });\n  if (notion) patch.notion = notion;\n  if (await writeDoc('works/' + w.id, patch, 'update')) toast('예상 ' + fmtH(est) + ' 보고했어요. 디자인 관리자 화면에 반영됐어요.');\n}\nasync function startFix(w, hrs) {\n  const now = new Date(); const end = addWorkHours(now, hrs);\n  const patch = statusPatch(w, 'fix', { fixHours: hrs, fixStartAt: now.toISOString(), fixEndAt: end.toISOString() });\n  if (await writeDoc('works/' + w.id, patch, 'update')) toast('수정 시작 · ' + whenTxt(end) + '쯤 끝나는 걸로 관리자 화면에 반영했어요.');\n}\nasync function requestReview(w) {\n  if (!isHttps(w.notion)) { askNotion(w); return; }\n  const again = isFixing(w) || +w.rounds > 0;\n  const patch = statusPatch(w, 'review'); Object.assign(patch, reviewMarks(w), { reviewAt: patch.statusAt });\n  if (await writeDoc('works/' + w.id, patch, 'update')) notifyBar('review', Object.assign({}, w, patch), { again });\n}\n// 관리자·마케터 둘 다 의견을 내야 다음 단계로: 하나라도 수정 필요 → 수정 필요, 둘 다 컨펌 완료 → 최종 완료\n// 두 의견이 다 모였을 때의 다음 단계. who = 두 번째(마지막)로 의견 낸 쪽 → 이 사람 화면에 팀즈 알림이 떠요.\nfunction settlePatch(w, who, log) {\n  const now = iso(); const otherWho = who === 'mgr' ? 'mk' : 'mgr';\n  if (w.chkMgr === 'ok' && w.chkMk === 'ok') {\n    // 상대가 이번 차수에 컨펌했으면 최종본을 이미 본 것, 앞 차수 컨펌이면 「최종본 확인」이 남아요\n    const saw = markThisRound(w, otherWho);\n    const p = Object.assign(statusPatch(w, 'done'), { finMgr: who === 'mgr' ? true : saw, finMk: who === 'mk' ? true : saw });\n    p.log = pushLog(log, { s: 'done', at: now, by: meId() }); return { kind: 'done', patch: p };\n  }\n  const p = Object.assign(statusPatch(w, 'fixreq'), { rounds: (+w.rounds || 0) + 1, fixHours: null, fixStartAt: null, fixEndAt: null });\n  p.log = pushLog(log, { s: 'fixreq', at: now, by: meId() }); return { kind: 'fixreq', patch: p };\n}\nasync function checkWork(w, who, val) {\n  if (key(w) !== 'review') { toast('지금은 컨펌 요청 단계가 아니에요.', 'bad'); return; }\n  const now = iso(); const f = who === 'mgr' ? 'chkMgr' : 'chkMk';\n  const other = who === 'mgr' ? w.chkMk : w.chkMgr;\n  const marks = { [f]: val, [f + 'At']: now, [f + 'By']: meId(), updatedAt: now };\n  const log = pushLog(w.log, { c: who, v: val, at: now, by: meId() });\n  let patch, kind = null;\n  if (other) { const r = settlePatch(Object.assign({}, w, marks), who, log); patch = Object.assign(r.patch, marks); kind = r.kind; }\n  else patch = Object.assign({}, marks, { log });   // 상대 의견이 아직 없으면 남기기만 하고 단계·팀즈는 그대로\n  if (!(await writeDoc('works/' + w.id, patch, 'update'))) return;\n  if (kind) { notifyBar(kind, Object.assign({}, w, patch)); return; }\n  toast('「' + (val === 'ok' ? '컨펌 완료' : '수정 필요') + '」로 남겼어요. ' + (who === 'mgr' ? '마케터' : '디자인 관리자') + ' 의견까지 모이면 다음 단계로 넘어가요.');\n  settleLater(w.id, who);\n}\n// 두 사람이 거의 동시에 누르면 서로 상대 의견을 못 본 채 저장돼서 컨펌 요청에 멈출 수 있어요.\n// 잠시 뒤 최신 상태를 다시 보고, 둘 다 의견이 있는데 아직 컨펌 요청 단계면 늦게 낸 쪽 화면에서 넘기고 팀즈 알림을 띄워요.\nasync function settleLater(id, who) {\n  for (const ms of S.demo ? [0] : [2500, 5000]) {\n    await sleep(ms);\n    const w = D().works[id];\n    if (!w || key(w) !== 'review') return;\n    if (!w.chkMgr || !w.chkMk) continue;\n    const later = (w.chkMgrAt || '') > (w.chkMkAt || '') ? 'mgr' : 'mk';\n    if (later !== who) return;\n    const r = settlePatch(w, who, w.log);\n    if (await writeDoc('works/' + id, r.patch, 'update')) notifyBar(r.kind, Object.assign({}, w, r.patch));\n    return;\n  }\n}\nasync function markFinal(w, who) {\n  const f = who === 'mgr' ? 'finMgr' : 'finMk';\n  if (await writeDoc('works/' + w.id, { [f]: true, [f + 'At']: iso(), updatedAt: iso() }, 'update')) toast('최종본 확인했어요.');\n}\nasync function assignTo(w, mid) {\n  const now = iso();\n  const patch = { designerId: mid, managerId: w.managerId || defaultManager(mid), assignedAt: now, assignedBy: meId(), updatedAt: now };\n  if (!w.receivedAt) patch.receivedAt = now;\n  if (key(w) === 'wait' || !w.designerId) Object.assign(patch, statusPatch(w, 'new', { log: pushLog(w.log, { s: 'new', at: now, by: meId(), to: mid }) }));\n  if (await writeDoc('works/' + w.id, patch, 'update')) notifyBar('assign', Object.assign({}, w, patch));\n}\n\n/* ---------- 팀즈 알림 ---------- */\n// 허브는 팀즈에 직접 글을 올릴 수 없어서, 메시지를 복사해 두고 팀즈 채팅이나 단체방을 열어 줘요. 보내기와 @멘션은 사람이 해요.\nlet barT = 0;\nfunction closeBar() { const b = $('#nbar'); b.hidden = true; b.replaceChildren(); clearTimeout(barT); }\nfunction teamsChat(emails, msg) {\n  const u = emails.map(e => encodeURIComponent(String(e).trim()).replace(/%40/g, '@')).join(',');\n  return 'https://teams.microsoft.com/l/chat/0/0?users=' + u + (msg ? '&message=' + encodeURIComponent(msg) : '');\n}\n// 팀즈 채팅 링크(https://teams.microsoft.com/l/chat/…)는 브라우저에서 웹 팀즈로 바로 열려요.\n// msteams:// 주소는 claude.ai 화면 안에서 막혀요(\"이 링크는 여기에서 열 수 없습니다\").\n// 그래서 팀즈 공식 실행 페이지(dl/launcher)를 새 탭으로 열고, 그 페이지가 PC 앱을 열게 해요. 웹 링크도 같이 둬요.\nconst TEAMS_WEB = /^https:\\/\\/teams\\.microsoft\\.com\\//i;\nfunction teamsAppUrl(u) {\n  const s = String(u || '').trim(); if (!TEAMS_WEB.test(s)) return '';\n  const path = s.replace(TEAMS_WEB, '/'); if (/^\\/dl\\/launcher\\//i.test(path)) return s;\n  const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());\n  return 'https://teams.microsoft.com/dl/launcher/launcher.html?url=' + encodeU navScrim').addEventListener('click', () => { document.body.classList.remove('navOpen'); $('#navScrim').hidden = true; });\nwindow.addEventListener('hashchange', () => {\n  document.body.classList.remove('navOpen'); $('#navScrim').hidden = true;\n  if (location.hash !== '#setup') DRAFT = null;\n  closeMenu(); render(); window.scrollTo(0, 0);\n});\n$('#content').addEventListener('focusout', () => {\n  if (!S.dirty) return;\n  setTimeout(() => { const a = document.activeElement; if (a && $('#content').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; S.dirty = false; scheduleRender(true); }, 0);\n});\nprep(); render();\nboot();\n})();\n<\/script>\n\n<\/body><\/html>";
/* =====================================================================
   AY-ON (에이온) · 공통 엔진

const $=(q,el=document)=>el.querySelector(q), $$=(q,el=document)=>[...el.querySelectorAll(q)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>(n<0?'-':'')+Math.abs(Math.round(n||0)).toLocaleString('ko-KR');
const man=n=>{const v=Math.round((n||0)/10000); return v.toLocaleString('ko-KR')+'만'};
const eok=n=>{const v=(n||0)/1e8; return (Math.abs(v)>=10?v.toFixed(0):v.toFixed(1))+'억'};
const nowHM=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const STAMP=()=>TODAY+' '+nowHM();
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}

/* =====================================================================
   스키마 엔진
   ENT[key] = { n:이름, menu:권한키, prefix:번호접두, fields:[...], cols:[...], search:[...],
                flow:{init, steps:[...], moves:[...]}, approval:{title,amount,line}, del:(r)=>사유|null,

const ENT={};
function fieldOpts(f,r){ if(f.ref){ const E=ENT[f.ref]; return T(f.ref).filter(x=>!E.use||x.use!=='사용 중지'||x.id===r?.[f.k]).filter(x=>!f.where||f.where(x,r)).map(x=>[x.id,E.label?E.label(x):x.name]) } return typeof f.opt==='function'?f.opt(r):(f.opt||[]) }
function refName(k,id){ if(!id) return ''; const r=byId(k,id); return r?(ENT[k].label?ENT[k].label(r):r.name):'(삭제됨)' }
function fmt(f,v,r){ if(v===undefined||v===null||v==='') return '<span class="faint">-</span>';
  if(f.t==='money') return `<span class="num">${won(v)}</span>`; if(f.t==='num') return `<span class="num">${Number(v).toLocaleString('ko-KR')}</span>`;
  if(f.t==='date') return `<span class="num">${esc(v)}</span>`; if(f.ref) return esc(refName(f.ref,v)); if(f.t==='chk') return v?'예':'아니오';
  if(f.t==='lines') return `${v.length}개 품목`; if(f.fmt) return f.fmt(v,r); return esc(v)}
function lineTotal(lines){return (lines||[]).reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0)}

function renderList(k,el,o={}){

  if(o.filter) rows=rows.filter(o.filter);
  const states=E.flow?E.flow.steps.concat(E.flow.extra||[]):(E.use?['사용','사용 중지']:[]);
  const sk=E.flow?'status':(E.use?'use':null);
  const counts=sk?Object.fromEntries(states.map(s=>[s,rows.filter(r=>r[sk]===s).length])):{};
  if(st.s&&sk) rows=rows.filter(r=>r[sk]===st.s);

  const sum=E.sumKey?rows.reduce((a,r)=>a+(+(typeof E.sumKey==='function'?E.sumKey(r):r[E.sumKey])||0),0):null;

  `<section class="panel"><div class="hd">
     <div class="filters"><input id="fq" placeholder="${esc((E.search||['name']).map(s=>(E.fields.find(f=>f.k===s)||{l:s}).l).join(' · '))} 검색" value="${esc(st.q)}" aria-label="검색">
       ${E.fields.some(f=>f.k==='corp')?`<select id="fcorp" aria-label="법인">${opts(T('corp').map(c=>[c.id,c.name]),st.corp,'전체 법인')}</select>`:''}</div>
     <div class="actions">${can(E.menu,'등록')&&!E.noAdd?`<button class="btn sm acc" id="fadd">${E.addLabel||E.n+' 등록'}</button>`:''}</div></div>
   ${sk?`<div class="stbar"><button class="chip ${!st.s?'on':''}" data-fs="">전체 <span class="num">${Object.values(counts).reduce((a,b)=>a+b,0)}</span></button>${states.map(s=>`<button class="chip ${st.s===s?'on':''}" data-fs="${s}">${s} <span class="num">${counts[s]}</span></button>`).join('')}</div>`:''}
   <div class="tw"><table class="t"><thead><tr>${cols.map(c=>`<th class="${c.t==='money'||c.t==='num'?'r':''}">${esc(c.l)}</th>`).join('')}${sk?'<th class="c">상태</th>':''}</tr></thead><tbody>
   ${rows.map(r=>`<tr class="click" tabindex="0" data-id="${r.id}">${cols.map((c,i)=>`<td class="${c.t==='money'||c.t==='num'?'r':''} ${i<2?'nw':''}">${i===0?'<b>':''}${c.v?c.v(r):fmt(c,c.t==='money'&&c.calc?c.calc(r):r[c.k],r)}${i===0?'</b>':''}</td>`).join('')}${sk?`<td class="c">${pill(r[sk])}</td>`:''}</tr>`).join('')||`<tr><td colspan="${cols.length+1}" class="empty">${E.empty||'등록된 항목이 없습니다.'}</td></tr>`}
   </tbody>${sum!==null?`<tfoot><tr><td colspan="${cols.length+(sk?1:0)}" class="r">합계 <b class="num">${won(sum)}</b> 원 · ${rows.length}건</td></tr></tfoot>`:''}</table></div></section>${o.bottom||''}`;
  const re=()=>renderList(k,el,o);

  $$('tr[data-id]',el).forEach(tr=>{tr.onclick=()=>openDetail(k,tr.dataset.id,re); tr.onkeydown=e=>{if(e.key==='Enter')openDetail(k,tr.dataset.id,re)}});
  o.after&&o.after(el,rows);
}
function noPerm(el,n){el.innerHTML=head(n,'')+`<section class="wip"><div class="ic">!</div><h2>권한이 없습니다</h2><p>이 메뉴를 쓰려면 시스템 관리자에게 권한을 요청하세요.</p></section>`}

  if(f.t==='lines') return ro?`<div class="wide"><div class="lab">${esc(f.l)} <i class="lk">잠금</i></div><div class="note">${(v||[]).map(l=>esc(refName('item',l.item))+' '+l.qty+'개 × '+won(l.price)).join('<br>')}</div></div>`:`<div class="wide"><div class="lab">${esc(f.l)}${req}</div>${linesEditor(f,v||[])}</div>`;
  if(f.t==='area') return `${lab}<textarea id="${id}" ${ro?'readonly':''}>${esc(v??'')}</textarea></label>`;

function linesEditor(f,lines){const items=T('item').filter(i=>i.use!=='사용 중지');

/* 참조 무결성: 다른 기록이 쓰고 있으면 삭제 차단 */

/* =====================================================================
   서버 연결 (Supabase)
   - config.js 에 주소 · 공개키가 있으면 서버 모드, 없으면 브라우저 시연 모드
   - 화면은 지금처럼 메모리의 DB를 쓰고, 바뀐 기록만 골라 서버에 저장
   - 다른 사람이 바꾼 기록은 실시간으로 받아 화면에 반영

let SB=null; const SNAP=new Map(); let _saveT=null, _saving=null, _rt=null, _rtT=null;
const SEP='\u0001', META=['seq','cfg'], NO_PW=['user','signup'];
if(CLOUD){ try{ SB=window.supabase.createClient(CFG.supabaseUrl,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'ayon.auth.'+ENV}}) }catch(e){ console.error(e) } }
const loginEmail=id=>id.includes('@')?id:id+'@gcway.com';
function emptyDB(){ return {seq:{},audit:[],cfg:{apprCeo:3000000,ctAlert:60,weeklyDue:'매주 금 17:00',wt:{'기본형':['10:00','19:00']}}} }

/* 메모리 DB ↔ 서버 기록(tbl, id, data) */
function toRows(db){ const out=[];
  for(const [k,v] of Object.entries(db)){
    if(META.includes(k)){ out.push(['_meta',k,v]); continue }
    if(!Array.isArray(v)) continue;
    for(const r of v){ const rid=k==='audit'?r.aid:r.id; if(!r||rid==null) continue; let d=r;
      if(NO_PW.includes(k)&&'pw' in d){ d={...d}; delete d.pw }
      if(k==='emp'){ const {card,...rest}=d; out.push(['empcard',r.id,{card:card||{}}]); d=rest }
      out.push([k,String(rid),d]) } }
  return out }
function fromRows(rows){ const db=emptyDB(); const cards={};
  for(const x of rows){ if(x.tbl==='_meta'){ db[x.id]=x.data; continue } if(x.tbl==='empcard'){ cards[x.id]=x.data.card; continue } (db[x.tbl]||(db[x.tbl]=[])).push(x.data) }
  (db.emp||[]).forEach(e=>{ e.card=cards[e.id]||{} });
  db.audit.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  for(const k of Object.keys(db)) if(Array.isArray(db[k])&&k!=='audit') db[k].sort((a,b)=>(a._o??0)-(b._o??0));
  return db }
const keyOf=(t,id)=>t+SEP+id;
const TBL_NM=t=>({inv_cost:'입고 단가',inv_mv:'재고 수불',inv_item:'품목 기준정보',inv_po:'발주',inv_adj:'재고 조정',inv_count:'실사',inv_cfg:'재고 설정',inv_log:'업로드 기록',hr_contract:'노무 계약',ct_supply:'상품공급 계약',company:'법인 정보',emp:'직원',empcard:'인사기록카드',org:'조직',user:'계정',role:'역할',grant:'권한 부여',_meta:'시스템 설정'})[t]||t;
/* 비교용 문자열: 키 순서를 정렬 (서버 jsonb 는 키 순서를 바꿔 돌려주므로, 그대로 비교하면 같은 기록을 '바뀜'으로 보고 다시 저장함) */
const stableStr=v=>v===undefined?'null':(v===null||typeof v!=='object')?JSON.stringify(v):Array.isArray(v)?'['+v.map(stableStr).join(',')+']':'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}';
const snapStr=(t,d)=>stableStr(d);

/* 전체 불러오기 (권한 안에서 보이는 기록만 옴) */
async function cloudLoad(){ const rows=[]; const step=1000;
  for(let from=0;;from+=step){ const {data,error}=await SB.from('ayon_records').select('tbl,id,data').neq('tbl','audit').order('tbl').order('created_at').order('id').range(from,from+step-1); if(error) throw error; rows.push(...data); if(data.length<step) break }
  const {data:au,error:e2}=await SB.from('ayon_records').select('tbl,id,data').eq('tbl','audit').order('updated_at',{ascending:false}).limit(3000); if(e2) throw e2; rows.push(...au);
  DB=fromRows(rows); SNAP.clear();
  // 비교 기준은 '다시 나눴을 때의 모양'으로 잡아야 불필요한 저장이 없음
  for(const [t,id,d] of toRows(DB)) SNAP.set(keyOf(t,id),snapStr(t,d));
  return DB }

/* 저장: 바뀐 기록만 upsert, 사라진 기록은 delete (변경 이력은 지우지 않음) */
function cloudSave(){ if(!S.user||!SB) return; clearTimeout(_saveT); _saveT=setTimeout(cloudFlush,250); syncState('저장 중') }
async function cloudFlush(){ if(_saving){ await _saving } if(!S.user) return; _saving=(async()=>{
  const ups=[], seen=new Set();
  for(const [t,id,d] of toRows(DB)){ const k=keyOf(t,id); seen.add(k); const s=snapStr(t,d); if(SNAP.get(k)!==s) ups.push({tbl:t,id,data:d,_s:s,_k:k}) }
  const dels={}; for(const k of SNAP.keys()) if(!seen.has(k)){ const [t,id]=k.split(SEP); if(t==='audit'){ SNAP.delete(k); continue } (dels[t]||(dels[t]=[])).push(id) }
  try{
    /* 변경 이력은 '추가'만 (이미 있으면 그대로 둠 — 서버 규칙상 고칠 수 없음) */
    const aud=ups.filter(u=>u.tbl==='audit'), rest=ups.filter(u=>u.tbl!=='audit');
    for(let i=0;i<aud.length;i+=400){ const ch=aud.slice(i,i+400); const {error}=await SB.from('ayon_records').upsert(ch.map(({tbl,id,data})=>({tbl,id,data})),{onConflict:'tbl,id',ignoreDuplicates:true}); if(error) console.warn('audit',error); ch.forEach(u=>SNAP.set(u._k,u._s)) }
    /* 나머지: 묶음으로 저장하다 실패하면 한 건씩 다시 → 실패한 건만 남기고 나머지는 저장 */
    const bad=[];
    for(let i=0;i<rest.length;i+=400){ const ch=rest.slice(i,i+400); const {error}=await SB.from('ayon_records').upsert(ch.map(({tbl,id,data})=>({tbl,id,data})),{onConflict:'tbl,id'});
      if(!error){ ch.forEach(u=>SNAP.set(u._k,u._s)); continue }
      for(const u of ch){ const {error:e1}=await SB.from('ayon_records').upsert([{tbl:u.tbl,id:u.id,data:u.data}],{onConflict:'tbl,id'}); if(e1) bad.push([u,e1]); else SNAP.set(u._k,u._s) } }
    if(bad.length){ console.error('save failed',bad); const by={}; bad.forEach(([u])=>{by[u.tbl]=(by[u.tbl]||0)+1});
      throw new Error(`권한이 없거나 막힌 기록 ${bad.length}건(${Object.entries(by).map(([t,n])=>TBL_NM(t)+' '+n).join(', ')}) — ${bad[0][1].message}`) }
    for(const [t,ids] of Object.entries(dels)) for(let i=0;i<ids.length;i+=200){ const part=ids.slice(i,i+200); const {error}=await SB.from('ayon_records').delete().eq('tbl',t).in('id',part); if(error) throw error; part.forEach(id=>SNAP.delete(keyOf(t,id))) }
    syncState('저장됨')
  }catch(e){ console.error(e); syncState('저장 실패',true); toast('서버 저장에 실패했습니다: '+(e.message||e)+' — 계속되면 화면을 새로 고친 뒤 다시 시도하세요.') }
 })(); await _saving; _saving=null }
function syncState(t,bad){ const el=$('#sync'); if(el){ el.textContent=t; el.classList.toggle('bad',!!bad) } }

/* 실시간: 다른 사람이 바꾼 기록 반영 */
function cloudRealtime(){ if(_rt) SB.removeChannel(_rt);
  _rt=SB.channel('ayon').on('postgres_changes',{event:'*',schema:'public',table:'ayon_records'},p=>{
    const row=p.new&&p.new.tbl?p.new:p.old; if(!row||!row.tbl) return; const t=row.tbl, id=row.id, k=keyOf(t,id);
    if(p.eventType==='DELETE'){ if(!SNAP.has(k)) return; SNAP.delete(k); if(t==='empcard') return; if(t==='_meta') return; DB[t]=T(t).filter(r=>String(r.id)!==String(id)) }
    else { const s=snapStr(t,p.new.data); if(SNAP.get(k)===s) return; SNAP.set(k,s); const d=p.new.data;
      if(t==='_meta') DB[id]=d;
      else if(t==='empcard'){ const e=byId('emp',id); if(e) e.card=d.card||{} }
      else if(t==='audit'){ if(!DB.audit.some(a=>a.aid===id)) DB.audit.unshift(d) }
      else { const arr=T(t); const i=arr.findIndex(r=>String(r.id)===String(id)); if(t==='emp'){ d.card=i>=0?arr[i].card:{} } if(i>=0) arr[i]=d; else arr.push(d) } }
    clearTimeout(_rtT); _rtT=setTimeout(()=>{ if(!S.user) return; renderBadges&&renderBadges(); if(!$('.scrim')) renderView() },400) }).subscribe() }

  let u=T('user').find(x=>x.id===id);
  /* 처음 로그인(자동 가입): 직원 명부와 맞으면 계정을 만들고 다시 불러옴 */
  if(!u&&!id.includes('@')&&typeof cloudActivate==='function'){ const er=await cloudActivate(); if(!er){ try{ await cloudLoad(); u=T('user').find(x=>x.id===id) }catch(e){} } }
  if(!u||!u.on){ const sr=T('signup').filter(x=>x.uid===id).pop(); await SB.auth.signOut(); DB=emptyDB(); SNAP.clear();
    if(u&&!u.on) return {msg:'사용이 중지된 계정입니다. 인사팀에 문의하세요.'};

    return {msg:'에이온 계정이 없습니다. 가입하기로 신청해 주세요.'} }
  return {u} }

function orgPath(id){return orgUp(id).reverse().map(x=>byId('org',x).name).join(' > ')}
function empName(id){const e=byId('emp',id);return e?`${e.name} ${dutyOf(e)||posName(e.pos)}`:''}
function posName(id){return byId('pos',id)?.name||''} function dutyName(id){return byId('duty',id)?.name||''}
function dutyOf(e){return e.duty?dutyName(e.duty):''}
function userOfEmp(empId){return T('user').find(u=>u.emp===empId)}
function meEmp(){return S.user?byId('emp',S.user.emp):null}
function leaderOf(orgId){ for(const o of orgUp(orgId)){const org=byId('org',o); if(org.head&&org.head!==S.user?.emp) return org.head} return null }

let idleT,warnT,cdT,lastAct=Date.now();
/* 자동 로그아웃 (v1.4.1): 10분 · 화면을 보지 않아도(다른 탭 · 절전 · 창 닫음) 시간이 흐름 · 여러 탭은 가장 최근 사용 기준 */
const IDLE_MIN=10;
const IDLE_MS=()=>$('#fastIdle')?.checked?30000:IDLE_MIN*60000, WARN_MS=()=>$('#fastIdle')?.checked?10000:60000;
const IDLE_TXT=()=>IDLE_MS()>=60000?Math.round(IDLE_MS()/60000)+'분':Math.round(IDLE_MS()/1000)+'초';
const LA_KEY='ayon.lastAct';
function lastSeen(){ let v=0; try{ v=+localStorage.getItem(LA_KEY)||0 }catch(e){} return Math.max(lastAct,v) }
function markAct(force){ lastAct=Date.now(); if(force||!markAct.t||lastAct-markAct.t>5000){ markAct.t=lastAct; try{ localStorage.setItem(LA_KEY,String(lastAct)) }catch(e){} } }
function idleExpired(){ return Date.now()-lastSeen()>=IDLE_MS() }
function idleOut(){ stopIdle(); $$('.scrim').forEach(x=>x.remove()); try{ localStorage.removeItem(LA_KEY) }catch(e){} logout(`${IDLE_TXT()} 동안 사용하지 않아 자동 로그아웃되었습니다.`) }
const EVS=['mousemove','keydown','click','touchstart','scroll','wheel'];
function onVis(){ if(document.visibilityState!=='hidden'&&idleExpired()) idleOut() }
function startIdle(){ stopIdle(); let prev=0; try{ prev=+localStorage.getItem(LA_KEY)||0 }catch(e){}
  if(prev&&Date.now()-prev>=IDLE_MS()){ lastAct=prev; return idleOut() }      /* 창을 닫았다가 오래 뒤에 다시 연 경우 */
  markAct(true); EVS.forEach(ev=>addEventListener(ev,onAct,{passive:true})); document.addEventListener('visibilitychange',onVis); addEventListener('focus',onVis); tick() }
function stopIdle(){clearTimeout(idleT);clearTimeout(warnT);clearInterval(cdT);EVS.forEach(ev=>removeEventListener(ev,onAct));document.removeEventListener('visibilitychange',onVis);removeEventListener('focus',onVis);$('#idleM')?.remove()}
function onAct(){ if($('#idleM')) return; if(idleExpired()) return idleOut(); markAct(); tick() }
function tick(){clearTimeout(idleT);clearTimeout(warnT); const left=IDLE_MS()-(Date.now()-lastSeen());
  warnT=setTimeout(()=>{ if(idleExpired()) return idleOut(); if(Date.now()-lastSeen()<IDLE_MS()-WARN_MS()-500) return tick(); showWarn() },Math.max(0,left-WARN_MS()));
  idleT=setTimeout(()=>{ if(idleExpired()) idleOut(); else tick() },Math.max(0,left))}
function showWarn(){const d=document.createElement('div');d.className='scrim center';d.id='idleM';
  d.innerHTML=`<div class="modal" role="alertdialog" aria-labelledby="iw"><h2 id="iw">곧 자동 로그아웃됩니다</h2><p class="pmeta" style="font-size:13px">보안을 위해 ${IDLE_TXT()} 동안 사용이 없으면 로그아웃됩니다.</p><div class="count" id="cd"></div><div class="actions"><button class="btn" id="iwOut">지금 로그아웃</button><button class="btn pri" id="iwKeep">로그인 연장</button></div></div>`;
  document.body.append(d); const upd=()=>{const s=Math.max(0,Math.ceil((lastSeen()+IDLE_MS()-Date.now())/1000)); if(s<=0) return idleOut(); if(Date.now()-lastSeen()<IDLE_MS()-WARN_MS()-500){ clearInterval(cdT); d.remove(); return tick() } $('#cd').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}; upd(); cdT=setInterval(upd,500);
  $('#iwKeep').onclick=()=>{clearInterval(cdT); d.remove(); markAct(true); tick(); toast(`로그인을 ${IDLE_TXT()} 연장했습니다.`)}; $('#iwOut').onclick=()=>{stopIdle(); logout('로그아웃했습니다.')}; $('#iwKeep').focus()}

  cols:['date','kind','name','uid','match'],search:['name','uid'],
  flow:{init:'대기',steps:['대기','승인'],extra:['반려'],moves:[

      if(r.kind==='임직원'){const pl=byId('user_plan',r.uid); T('user').push({id:r.uid,emp:m[2].id,pw:r.pw,roles:(pl&&pl.roles||[]).filter(x=>byId('role',x)),on:true})} else {const p=m[2]; T('user').push({id:r.uid,name:r.name,pw:r.pw,roles:['R-EXT'],on:true,ext:true,partner:p.partner}); p.used=true}}},
    {id:'no',l:'반려',from:['대기'],to:'반려',act:'승인',reason:true,run:(r,why)=>{r.why=why}},

    {id:'unno',l:'반려 취소',from:['반려'],to:'대기',rev:true,act:'승인',run:r=>{r.why=''}}]}};
function signupMatch(r){ if(r.kind==='임직원'){const em=x=>String(x.email||'').toLowerCase().split('@')[0]; const e=T('emp').find(x=>em(x)===r.uid&&x.status!=='퇴사')||T('emp').find(x=>em(x)===r.uid); if(!e) return ['인사 미등록','bad']; if(String(e.name).replace(/\s/g,'')!==String(r.name).replace(/\s/g,'')) return ['이름 불일치','warn']; if(e.status==='퇴사') return ['퇴사자','bad']; if(T('user').some(u=>u.id===r.uid)&&r.status!=='승인') return ['이미 계정 있음','bad']; return ['일치','ok',e]}
  const iv=T('invite').find(i=>i.code===r.empNo); if(!iv) return ['초대 코드 없음','bad']; if(iv.used&&r.status!=='승인') return ['사용된 코드','bad']; if(iv.email!==r.uid) return ['초대 이메일 불일치','warn']; return ['초대 일치','ok',iv]}

   <button type="button" class="kind" data-k="임직원"><b>임직원</b><span>회사 이메일 아이디(@ 앞)와 이름으로 가입합니다. 인사팀 · 관리자가 승인하면 바로 로그인됩니다.</span></button>
   <button type="button" class="kind" data-k="개인 계약자"><b>개인 계약자 (회사 대 개인)</b><span>담당자에게 받은 초대 코드가 필요합니다.</span></button>
   <button type="button" class="kind" data-k="기업 거래처"><b>기업 거래처 (회사 대 회사)</b><span>담당자에게 받은 초대 코드와 사업자등록번호가 필요합니다.</span></button></div><div class="actions"><button type="button" class="btn" data-x>닫기</button></div>`,(f,d)=>$$('[data-k]',f).forEach(b=>b.onclick=()=>{d.remove();signupForm(b.dataset.k)})) }
function signupForm(kind){const emp=kind==='임직원';
  modal(`<h2>${kind} 가입</h2><div class="fgrid2">
   <label for="sn"${emp?' class="wide"':''}>${kind==='기업 거래처'?'담당자 이름':'이름'}<input id="sn" required></label>
   ${emp?'':'<label for="sno">초대 코드<input id="sno" required placeholder="INV-0000"></label>'}
   ${kind==='기업 거래처'?'<label for="sbz">상호<input id="sbz" required></label><label for="sbn">사업자등록번호<input id="sbn" required></label>':''}
   <label for="sid" class="wide">${emp?'아이디 (회사 이메일 @ 앞)':'이메일 (아이디)'}<div class="inp"><input id="sid" required autocapitalize="off">${emp?'<span class="sfx">@gcway.com</span>':''}</div></label>
   <label for="sp1">비밀번호 (10자 이상)<div class="inp"><input id="sp1" type="password" required placeholder="영문 · 숫자 · 특수문자 모두"><button type="button" class="eye" data-eye="sp1" aria-label="비밀번호 보기">${EYE}</button></div></label>
   <label for="sp2">비밀번호 확인<div class="inp"><input id="sp2" type="password" required><button type="button" class="eye" data-eye="sp2" aria-label="비밀번호 보기">${EYE}</button></div></label>
   <label class="wide" for="sag" style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;margin-top:4px;cursor:pointer"><input type="checkbox" id="sag" style="width:16px;height:16px;min-width:16px;margin:0;flex:none"><span>개인정보 수집 · 이용에 동의합니다.</span></label></div>
   <div class="msg err" id="smsg"></div><div class="actions"><button type="button" class="btn" data-x>취소</button><button class="btn pri">가입 신청</button></div>`,(f,d)=>{
    $$('[data-eye]',f).forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.eye,f);const on=i.type==='password';i.type=on?'text':'password';b.innerHTML=on?EYE_OFF:EYE});
    f.onsubmit=e=>{e.preventDefault(); const m=$('#smsg',f), id=$('#sid',f).value.trim().toLowerCase(), p=$('#sp1',f).value;
      if(!$('#sn',f).value.trim()||(!emp&&!$('#sno',f).value.trim())||!id) return m.textContent='모든 항목을 입력하세요.';
      if(emp&&!/^[a-z]+[0-9]?$/.test(id)) return m.textContent='아이디는 영문 소문자로 이름과 성을 붙여 씁니다.';
      if(p.length<10||!/[A-Za-z]/.test(p)||!/\d/.test(p)||!/[^A-Za-z0-9]/.test(p)) return m.textContent='비밀번호는 10자 이상, 영문 · 숫자 · 특수문자를 모두 넣어야 합니다.';
      if(p!==$('#sp2',f).value) return m.textContent='비밀번호 확인이 일치하지 않습니다.';
      if(!$('#sag',f).checked) return m.textContent='개인정보 수집 · 이용에 동의해야 합니다.';
      if(T('user').some(u=>u.id===id)||T('signup').some(s=>s.uid===id&&s.status==='대기')) return m.textContent='이미 가입했거나 승인 대기 중인 아이디입니다.';
      const r={id:uid('SU'),kind,name:kind==='기업 거래처'?$('#sbz',f).value.trim()+' · '+$('#sn',f).value.trim():$('#sn',f).value.trim(),uid:id,empNo:emp?'':$('#sno',f).value.trim().toUpperCase(),pw:p,date:TODAY,status:'대기'};
      if(emp) r.name=$('#sn',f).value.trim();
      if(CLOUD){ const b=$('.modal button.pri',f); b.disabled=true; m.className='msg info'; m.textContent='신청 중…'; cloudSignup(r,p).then(err=>{ b.disabled=false; if(err){m.className='msg err'; m.textContent=err; return} d.remove(); const lm=$('#lmsg'); if(lm){lm.textContent=`가입 신청을 보냈습니다. ${loginEmail(id)} 로 온 인증 메일을 누른 뒤, 인사팀 승인이 나면 로그인할 수 있습니다.`;lm.className='msg info'}}); return }
      T('signup').push(r); audit('signup',r.id,'가입 신청',r.name); save(); d.remove(); const lm=$('#lmsg'); if(lm){lm.textContent='가입 신청을 보냈습니다. 승인 후 로그인할 수 있습니다.';lm.className='msg info'}}})}

  `<div class="filters" style="margin:0 0 10px"><input id="ufq" type="search" placeholder="이름 · 아이디 · 부서 검색" value="${esc(uf.q)}" aria-label="이름 · 아이디 · 부서 검색" style="min-width:240px"><select id="ufr" aria-label="역할로 거르기"><option value="">전체 역할</option>${T('role').filter(r=>r.id!=='R-BASE').map(r=>`<option value="${r.id}" ${uf.r===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select><span class="pmeta">${us.length} / ${all.length}명</span></div>
  <section class="panel"><div class="tw"><table class="t"><thead><tr><th>아이디</th><th>이름</th><th>소속</th><th>역할 (개인 부여)</th><th>부서로 받은 역할</th><th>최근 로그인</th><th class="c">상태</th><th></th></tr></thead><tbody>
  ${us.map(u=>{const e=byId('emp',u.emp); const og=e?orgUp(e.org):[]; const dg=T('grant').filter(g=>g.tt==='부서'&&og.includes(g.tg)).map(g=>refName('role',g.role));
    return `<tr><td class="num nw"><b>${esc(u.id)}</b></td><td class="nw">${esc(e?empName(e.id):u.name)}</td><td style="font-size:12px">${e?esc(orgPath(e.org)):'외부'}</td><td style="font-size:12px">${(u.roles||[]).map(r=>`<span class="tag">${esc(refName('role',r))}</span>`).join(' ')||'-'}</td><td style="font-size:12px">${dg.map(x=>`<span class="tag">${esc(x)}</span>`).join(' ')||'-'}</td><td class="num" style="font-size:12px">${u.last||'-'}</td><td class="c">${pill(u.on?'사용':'사용 중지')}</td>

  bind();

  $$('[data-ur]',el).forEach(b=>b.onclick=()=>{const u=T('user').find(x=>x.id===b.dataset.ur); modal(`<h2>${esc(u.id)} 역할</h2><div class="ivs">${T('role').filter(r=>r.id!=='R-BASE').map(r=>`<label class="chkl" for="ro_${r.id}"><input type="checkbox" id="ro_${r.id}" value="${r.id}" ${(u.roles||[]).includes(r.id)?'checked':''}> ${esc(r.name)}</label>`).join('')}</div><p class="pmeta">기본 사용자 역할은 모든 계정에 자동으로 붙습니다.</p><div class="actions"><button type="button" class="btn" data-x>취소</button><button class="btn pri">저장</button></div>`,(f,d)=>f.onsubmit=e=>{e.preventDefault(); const nw=$$('input:checked',f).map(i=>i.value); if(u.id===S.user.id&&(u.roles||[]).includes('R-ADMIN')&&!nw.includes('R-ADMIN')){toast('자기 자신의 시스템 관리자 역할은 뺄 수 없습니다.');return} audit('user',u.id,'역할 변경',(u.roles||[]).map(x=>refName('role',x)).join(',')+' → '+nw.map(x=>refName('role',x)).join(',')); u.roles=nw; if(S.user.id===u.id)S.user.roles=nw; save(); d.remove(); VIEWS.user(el); toast('역할을 저장했습니다.')})});
  $$('[data-uo]',el).forEach(b=>b.onclick=()=>{const u=T('user').find(x=>x.id===b.dataset.uo); if(u.id===S.user.id) return toast('자기 계정은 중지할 수 없습니다.'); u.on=!u.on; audit('user',u.id,u.on?'다시 사용':'사용 중지'); save(); VIEWS.user(el); toast(u.on?'계정을 다시 사용합니다.':'계정을 중지했습니다. 로그인할 수 없습니다.')});
  $$('[data-up]',el).forEach(b=>b.onclick=()=>{const u=T('user').find(x=>x.id===b.dataset.up); if(u.id===S.user.id) return toast('본인 비밀번호는 다른 관리자에게 초기화를 요청하세요.');

      u.reset=true; delete u.pw; audit('user',u.id,'비밀번호 초기화','다음 로그인 때 새로 만듦'); save(); toast('초기화했습니다. 다음 로그인 때 새 비밀번호를 만듭니다.')})});
};
function roleEditor(r,re){ modal(`<h2>${r?'역할 수정':'역할 만들기'}</h2><div class="fgrid2"><label for="rn">역할명<input id="rn" required value="${esc(r?.name||'')}"></label><label for="rd">설명<input id="rd" value="${esc(r?.desc||'')}"></label></div>${permMatrix(r||{perm:{}},false)}<p class="pmeta">"승인"은 상태 처리(확인 · 승인 · 마감 등)를 할 수 있는 권한입니다. 결재 승인은 결재선에 지정된 사람이 합니다.</p><div class="actions"><button type="button" class="btn" data-x>취소</button><button class="btn pri">${r?'저장':'만들기'}</button></div>`,(f,d)=>f.onsubmit=e=>{e.preventDefault(); const name=$('#rn',f).value.trim(); if(!name) return; if(T('role').some(x=>x!==r&&x.name===name)) return toast('같은 이름의 역할이 있습니다.');

    if(r){Object.assign(r,{name,desc:$('#rd',f).value,perm}); audit('role',r.id,'수정',name)} else {const n={id:uid('R-'),name,desc:$('#rd',f).value,perm}; T('role').push(n); audit('role',n.id,'등록',name)} save(); d.remove(); re(); toast('역할을 저장했습니다.')},true)}
function roleDetail(id,re){ const r=byId('role',id); openDetail('role',id,re); const d=$$('.scrim').at(-1); const ed=$('[data-ed]',d); if(ed){ed.onclick=()=>{d.remove();roleEditor(r,re)}} }
function grantForm(re){ modal(`<h2>권한 부여</h2><div class="fgrid2"><label for="gt">대상 구분<select id="gt">${opts(['부서','개인'])}</select></label><label for="gv">대상<select id="gv"></select></label><label for="gr">역할<select id="gr">${opts(T('role').filter(r=>r.id!=='R-BASE').map(r=>[r.id,r.name]))}</select></label><label for="gf">시작일<input id="gf" type="date" value="${TODAY}"></label><label for="gto">종료일 (비우면 계속)<input id="gto" type="date"></label><label for="gm">사유<input id="gm" placeholder="예) 마케팅 5팀장 공석 대행"></label></div><div class="actions"><button type="button" class="btn" data-x>취소</button><button class="btn pri">부여</button></div>`,(f,d)=>{
  const fill=()=>{$('#gv',f).innerHTML=opts($('#gt',f).value==='부서'?T('org').map(o=>[o.id,orgPath(o.id)]):T('user').filter(u=>!u.ext).map(u=>[u.id,empName(u.emp)+' ('+u.id+')']))}; fill(); $('#gt',f).onchange=fill;
  f.onsubmit=e=>{e.preventDefault(); const g={id:uid('GR'),tt:$('#gt',f).value,tg:$('#gv',f).value,role:$('#gr',f).value,from:$('#gf',f).value,to:$('#gto',f).value,memo:$('#gm',f).value,by:S.user.name}; if(g.to&&g.to<g.from) return toast('종료일이 시작일보다 빠릅니다.'); T('grant').push(g); audit('grant',g.id,'권한 부여',refName('role',g.role)); save(); d.remove(); re(); toast('권한을 부여했습니다.')}})}

    save(); logout(full?'샘플 데이터로 다시 시작했습니다.':'빈 상태로 시작했습니다. 다시 로그인하세요.') };
  $('#dSample',el)&&($('#dSample',el).onclick=()=>ask('샘플 데이터로 다시 시작','지금까지 입력한 내용이 모두 지워지고 샘플 데이터로 바뀝니다.','다시 시작',()=>reset(true)));

      r.leave=ld; r.leaveWhy=$('#lr',f).value; r.status=ld<=TODAY?'퇴사':'퇴사 예정'; r.hist.push({d:ld,k:'퇴사',v:r.leaveWhy+($('#lm',f).value?' · '+$('#lm',f).value:''),by:S.user.name});

  if(b.dataset.unretire){const r=byId('emp',b.dataset.unretire); if(isClosed(r.leave)) return toast('퇴사일이 마감된 달입니다. 마감 해제 후 취소하세요.'); ask('퇴사 취소',`${esc(r.name)}의 ${r.leave} 퇴사를 취소하고 재직으로 되돌립니다.`,'퇴사 취소',why=>{const u=userOfEmp(r.id); if(u) u.on=true; r.hist.push({d:TODAY,k:'퇴사 취소',v:r.leave+' 퇴사 취소 · '+why,by:S.user.name}); r.leave='';r.leaveWhy=''; r.status='재직'; audit('emp',r.id,'퇴사 취소',why); save(); sc&&sc.remove(); renderView(); toast('재직으로 되돌렸습니다. 개인 권한은 다시 부여해야 합니다.')},true)}
});

/* 발령: 결재 → 확정 시 반영, 취소 시 원래대로 */
const APK={승진:'pos',승급:'grade',보직:'duty',전보:'org',직책해제:'duty'};
ENT.appoint={n:'발령',menu:'appoint',eb:'인사',prefix:'HA',lead:'승진(직위) · 승급(직급) · 보직(직책) · 전보(소속)를 결재로 확정합니다. 확정되면 직원 정보에 자동 반영되고, 취소하면 원래대로 돌아갑니다.',lockClosed:true,
  fields:[{k:'emp',l:'대상자',ref:'emp',req:true,where:e=>e.status!=='퇴사'},{k:'kind',l:'구분',t:'sel',opt:['승진','승급','보직','직책해제','전보'],req:true},{k:'date',l:'발령일',t:'date',req:true,def:TODAY},
    {k:'toPos',l:'변경 직위',ref:'pos',show:r=>!r.kind||r.kind==='승진'},{k:'toGrade',l:'변경 직급',ref:'grade',show:r=>!r.kind||['승진','승급'].includes(r.kind)},{k:'toDuty',l:'변경 직책',ref:'duty',show:r=>!r.kind||r.kind==='보직'},{k:'toOrg',l:'변경 소속',ref:'org',show:r=>!r.kind||r.kind==='전보'},
    {k:'reason',l:'근거 · 사유',t:'area'}],
  cols:['no','emp','kind','date'],search:['no','emp'],title:r=>`${refName('emp',r.emp)} ${r.kind}`,
  validate:v=>({승진:v.toPos?null:'변경 직위를 고르세요.',승급:v.toGrade?null:'변경 직급을 고르세요.',보직:v.toDuty?null:'변경 직책을 고르세요.',전보:v.toOrg?null:'변경 소속을 고르세요.',직책해제:null})[v.kind],
  editable:r=>['작성','반려'].includes(r.status),
  approval:{type:'일반 품의',title:r=>`[발령] ${refName('emp',r.emp)} ${r.kind} (${r.date})`,amount:()=>0},
  flow:{init:'작성',steps:['작성','결재중','확정'],extra:['반려','취소'],approvedTo:'확정',
    onApproved:r=>applyAppoint(r),onUnapproved:r=>revertAppoint(r),
    moves:[{id:'sub',l:'결재 상신',from:['작성','반려'],approval:true,self:true},
      {id:'wd',l:'결재 회수',from:['결재중'],rev:true,self:true,run:r=>{const a=byId('appr',r.appr); if(a) apprAct(a,'회수','기안자 회수')},to:null},
      {id:'cx',l:'발령 취소 (원래대로)',from:['확정'],to:'취소',rev:true,check:r=>isClosed(r.date)?'마감된 달의 발령은 취소할 수 없습니다.':null,run:r=>revertAppoint(r)},
      {id:'del2',l:'작성 취소',from:['작성','반려'],to:'취소',rev:true,self:true},{id:'re',l:'다시 작성',from:['취소'],to:'작성',rev:true,guard:r=>!r.applied}]}};
function applyAppoint(r){const e=byId('emp',r.emp); const f=APK[r.kind]; r.before={pos:e.pos,grade:e.grade,duty:e.duty,org:e.org};
  if(r.kind==='승진'){e.pos=r.toPos; if(r.toGrade) e.grade=r.toGrade} else if(r.kind==='승급') e.grade=r.toGrade; else if(r.kind==='보직') e.duty=r.toDuty; else if(r.kind==='직책해제') e.duty=''; else if(r.kind==='전보') e.org=r.toOrg;
  const desc={승진:`${posName(r.before.pos)} → ${posName(e.pos)}`,승급:`${refName('grade',r.before.grade)||'-'} → ${refName('grade',e.grade)}`,보직:`${dutyName(r.before.duty)||'없음'} → ${dutyName(e.duty)}`,직책해제:`${dutyName(r.before.duty)} 해제`,전보:`${orgPath(r.before.org)} → ${orgPath(e.org)}`}[r.kind];
  e.hist.push({d:r.date,k:r.kind,v:desc+(r.reason?' · '+r.reason:''),by:r.no,ap:r.id}); r.applied=true; audit('emp',e.id,'발령 반영',r.kind+' '+desc)}
function revertAppoint(r){ if(!r.applied) return; const e=byId('emp',r.emp); Object.assign(e,r.before); e.hist.push({d:TODAY,k:'발령 취소',v:`${r.no} ${r.kind} 취소`,by:S.user.name}); r.applied=false; audit('emp',e.id,'발령 취소',r.no)}

     ${op?`${mem.map(e=>`<div class="ctrow" style="padding-left:${lv*20+34}px">${e.card?.photo?`<img class="av" src="${e.card.photo}" alt="">`:`<span class="av">${esc(e.name.slice(0,1))}</span>`}<span class="ct"><b>${esc(e.name)} ${esc(dutyOf(e)||posName(e.pos))}</b> <span class="num">${esc(e.phone||'-')}</span> · <span class="num">${esc(e.email)}@gcway.com</span></span>${e.status==='퇴사 예정'?' '+pill('퇴사 예정'):''}</div>`).join('')}${kids.length?`<ul>${kids.map(k=>node(k,lv+1)).join('')}</ul>`:''}`:''}</li>`};
  el.innerHTML=head('조직관리 · 조직도','인사',`재직 ${T('emp').filter(e=>e.status!=='퇴사').length}명 · 조직 ${T('org').length}개`)+top+`<section class="panel"><div class="hd"><h2>조직도</h2><div class="chips"><button class="chip" id="oex">모두 펼치기</button><button class="chip" id="ocol">모두 접기</button>${ed&&!roots.length?'<button class="btn sm acc" id="oroot">회사 등록</button>':''}</div></div><ul class="tree">${roots.map(r=>node(r,0)).join('')||'<li class="empty">조직이 없습니다.</li>'}</ul></section><p class="note" style="margin-top:12px">조직도의 연락처는 휴대폰과 회사 이메일만 보입니다. 조직의 월말 확정본은 "월 마감"에서 저장 · 조회합니다.</p>`;
  bind(); S.ofold=S.ofold||new Set();
  $$('[data-of]',el).forEach(b=>b.onclick=()=>{const id=b.dataset.of; S.ofold.has(id)?S.ofold.delete(id):S.ofold.add(id); VIEWS.org(el)});
  $('#oex',el).onclick=()=>{S.ofold.clear();VIEWS.org(el)}; $('#ocol',el).onclick=()=>{T('org').forEach(o=>o.parent&&S.ofold.add(o.id));VIEWS.org(el)};

function attOf(emp,d){return T('att').find(a=>a.emp===emp&&a.date===d)}
function hm(t){if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+m}
function judge(a,emp){const e=byId('emp',emp); const [si,so]=DB.cfg.wt[e?.wt||'기본형']||['10:00','19:00']; const f=[];
  if(a.kind==='연차') return [['연차','mute']]; if(a.in&&hm(a.in)>hm(si)&&a.kind!=='오전 반차') f.push(['지각','bad']); if(a.out&&hm(a.out)<hm(so)&&a.kind!=='오후 반차') f.push(['조퇴','warn']);
  if(a.out&&hm(a.out)>=hm('20:30')) f.push(['야근 식대','done']); if(a.out&&hm(a.out)>=hm('22:30')) f.push(['택시','done']); if(a.in&&!a.out&&a.date<TODAY) f.push(['퇴근 누락','warn']); return f}

function inM(d,m){return d&&d.slice(0,7)===m}
function plCalc(m,dim){ const groups={}; const G=k=>groups[k]||(groups[k]={sales:0,cogs:0,fee:0,ad:0,logi:0,sga:0,labor:0});
  const key=(corp,brand)=>dim==='brand'?(brand||'공통'):dim==='team'?(byId('brand',brand)?.team||'공통'):(corp||'공통');
  T('sale').filter(s=>['출고완료','정산완료'].includes(s.status)&&inM(s.date,m)).forEach(s=>{const tot=lineTotal(s.lines)||1; s.lines.forEach(l=>{const it=byId('item',l.item); const g=G(key(s.corp,it?.brand)); const amt=l.qty*l.price; g.sales+=amt; g.cogs+=(l.cost||0)*l.qty; g.fee+=Math.round(amt*(+s.feeRate||0)/100)})});
  T('expense').filter(x=>['승인','지급완료'].includes(x.status)&&inM(x.date,m)).forEach(x=>{const a=byId('acct',x.acct); const g=G(key(x.corp,x.brand)); const c=a?.cat; const v=+x.amount||0; if(c==='광고비')g.ad+=v; else if(c==='물류비')g.logi+=v; else if(c==='인건비')g.labor+=v; else if(c==='판매수수료')g.fee+=v; else if(c!=='영업외')g.sga+=v});
  T('pladj').filter(x=>x.month===m).forEach(x=>{const a=byId('acct',x.acct); const g=G(key(x.corp,x.brand)); const c=a?.cat; const v=+x.amount||0; if(c==='광고비')g.ad+=v; else if(c==='인건비')g.labor+=v; else if(c==='물류비')g.logi+=v; else g.sga+=v});
  const fin=g=>{g.gp=g.sales-g.cogs; g.cm=g.gp-g.fee-g.ad-g.logi; g.op=g.cm-g.sga-g.labor; return g};
  Object.values(groups).forEach(fin); const tot=fin(Object.values(groups).reduce((a,g)=>{for(const k of ['sales','cogs','fee','ad','logi','sga','labor'])a[k]+=g[k];return a},{sales:0,cogs:0,fee:0,ad:0,logi:0,sga:0,labor:0}));
  return {groups,tot}}

function plTabs(){return `<div class="chips tabs">${[['표','손익표'],['조정','손익 조정']].map(([k,n])=>`<button class="chip ${(S.pltab||'표')===k?'on':''}" data-pt="${k}">${n}</button>`).join('')}</div>`}
function bindPlTabs(el){$$('[data-pt]',el).forEach(b=>b.onclick=()=>{S.pltab=b.dataset.pt;VIEWS.pl(el)})}
function barChart(data,labels){ if(!data.length) return '<p class="pmeta">데이터가 없습니다.</p>'; const max=Math.max(1,...data.flatMap(d=>[d.a,d.b,d.c].map(Math.abs))); const W=640,H=200,pad=34,bw=(W-pad*2)/data.length; const y=v=>H-24-(v/max)*(H-50);
  return `<div class="chart" role="img" aria-label="월별 ${labels.join(', ')}"><svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${pad}" x2="${W-8}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${data.map((d,i)=>{const x=pad+i*bw+bw*0.15, w=bw*0.7/3; return [d.a,d.b,d.c].map((v,j)=>`<rect x="${x+j*w}" y="${Math.min(y(v),y(0))}" width="${w-2}" height="${Math.max(1,Math.abs(y(v)-y(0)))}" rx="2" class="b${j}"><title>${labels[j]} ${won(v)}원</title></rect>`).join('')+`<text x="${x+bw*0.35}" y="${H-6}" text-anchor="middle" class="ax">${d.x}</text><text x="${x+w/2}" y="${Math.min(y(d.a),y(0))-4}" text-anchor="middle" class="vl">${eok(d.a)}</text>`}).join('')}</svg><div class="legend">${labels.map((l,j)=>`<span><i class="dot b${j}"></i>${l}</span>`).join('')}</div></div>`}

function arRow(tr,a,AM){ let P=a.parts.length?a.parts.map(p=>({r:p.r,q:p.q,memo:p.memo||''})):[{r:a.q<0?'폐기':'실사 차이',q:a.q,memo:''}];

 const draw=()=>{

   <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="b sm" id="arAdd">+ 사유 추가</button><button class="b sm p" id="arOk">저장</button>${a.rec?'<button class="b sm" id="arDel">등록 지우기</button>':''}<button class="b sm" id="arNo">닫기</button><span class="note" id="arSum"></span></div></div></td>`; sumT();

/* ---------- 실사 → 과거 기초 · 입고 소비기한 채우기 (v1.8) ----------
   실사일에 남아 있던 재고(선입선출)를 원래 기초 · 입고 건으로 거슬러 올라가, 그 건의 소비기한을 실사 값으로 바꿈
   - 이미 넣은 값이 있어도 실사 값으로 교체 · 한 입고 건이 여러 소비기한으로 나뉘면 가장 빠른 소비기한 하나로
   - 바꾼 내역은 실사 기록(bf)에 남겨 실사를 지우면 되돌림 · 소비기한 변경 이력(eh)에 '실사로 채움' */
function cntBackfill(id){ const x=CNT[id]; if(!x||!MV[x.code])return null; const k=x.code, f=fifo(k,x.d), E={};
 for(const l of f.layers){ if(!(l.q>0)||!l.e)continue; const key=l.d==='기초'?'open':(l.d===l.ind&&/^\d{4}-\d{2}-\d{2}$/.test(l.d)?'in|'+l.d:(l.adj?'adj|'+l.ind:null)); if(!key)continue; if(!E[key]||l.e<E[key])E[key]=l.e }
 const c=JSON.parse(JSON.stringify(COST[k]||{open:null,r:{},oe:null,e:{}})); c.r=c.r||{}; c.e=c.e||{}; c.ae=c.ae||{}; const items=[];
 for(const key in E){ const e=E[key];
  if(key==='open'){ const old=c.oe??null; if(JSON.stringify(old)!==JSON.stringify(e)){items.push({kind:'open',d:'기초',old,new:e});c.oe=e} }
  else if(key.startsWith('adj|')){ const d=key.slice(4); if(e<d)continue; const old=c.ae[d]??null; if(old!==e){items.push({kind:'adj',d,old,new:e});c.ae[d]=e} }
  else { const d=key.slice(3); if(e<d)continue; const old=c.e[d]??null; if(JSON.stringify(old)!==JSON.stringify(e)){items.push({kind:'in',d,old,new:e});c.e[d]=e} } }
 return {k,c,items} }
async function applyBackfill(id){ const x=CNT[id]; const r=cntBackfill(id); const at=new Date().toISOString(), by=me?me.nm:'';
 if(r&&r.items.length){ r.c.eh=(r.c.eh||[]).concat(r.items.map(i=>({d:i.d,o:i.old,n:i.new,by,at,src:'실사 '+x.d}))).slice(-60);
  COST[r.k]=r.c; pending[r.k]=r.c; queueWrite(r.k);
  if(typeof audit==='function')try{audit('inv_cost',r.k,'실사로 소비기한 채움',`${MV[r.k]?.name||r.k} 실사 ${x.d} · ${r.items.map(i=>`${i.d} ${Array.isArray(i.old)?'나눔':i.old||'없음'}→${i.new}`).join(', ')}`)}catch(e){} }
 x.bf={at,by,items:((x.bf&&x.bf.items)||[]).concat(r?r.items:[])}; x.bfv=1; CNT[id]=x;
 if(db)try{await db.collection('count').doc(id).set(JSON.parse(JSON.stringify(x)))}catch(e){}
 return r?r.items.length:0 }
function undoBackfill(x){ if(!x||!x.bf||!x.bf.items.length||!MV[x.code])return; const k=x.code, c=JSON.parse(JSON.stringify(COST[k]||{open:null,r:{},oe:null,e:{}})); c.e=c.e||{}; c.ae=c.ae||{}; let n=0;
 for(const i of x.bf.items.slice().reverse()){ if(i.kind==='open'){ if(JSON.stringify(c.oe??null)===JSON.stringify(i.new)){c.oe=i.old;n++} } else if(i.kind==='adj'){ if((c.ae[i.d]??null)===i.new){ if(i.old==null)delete c.ae[i.d]; else c.ae[i.d]=i.old; n++ } } else if(JSON.stringify(c.e[i.d]??null)===JSON.stringify(i.new)){ if(i.old==null)delete c.e[i.d]; else c.e[i.d]=i.old; n++ } }
 if(n){ COST[k]=c; pending[k]=c; queueWrite(k) } }

function paginate(c,rrn){
 const raw=ctBlocks(c),flat=[];
 raw.forEach(b=>{if(b.t==='art'){flat.push({t:'ah',h:b.h,first:b.items[0]});b.items.slice(1).forEach(x=>flat.push({t:'ai',x}))}else flat.push(b)});
 const meas=document.createElement('div');meas.className='ct-pg ct-meas';meas.style.cssText=`position:absolute;left:-9999px;top:0;width:${PG.w}px;padding:0 ${PG.side}px;visibility:hidden`;document.body.appendChild(meas);
 meas.innerHTML=flat.map(b=>`<div class="blk">${blockHTML(b,c,rrn)}</div>`).join('');
 const avail=PG.h-PG.top-PG.bot, pages=[[]]; let start=0;
 [...meas.children].forEach((el,i)=>{const top=el.offsetTop,bot=top+el.offsetHeight;if(bot-start>avail&&pages[pages.length-1].length){pages.push([]);start=top}pages[pages.length-1].push(flat[i])});
 meas.remove();
 const G=coInfo(c.co);
 return pages.map((P,i)=>`<div class="ct-pg" style="width:${PG.w}px;height:${PG.h}px;padding:${PG.top}px ${PG.side}px 0"><div class="ct-body">${P.map(b=>`<div class="blk">${blockHTML(b,c,rrn)}</div>`).join('')}</div><div class="ct-foot">${G.logo?`<img src="${G.logo}" alt="${esc(G.full||c.co)}">`:`<span class="ct-nologo">${esc(G.full||c.co)}</span>`}<div class="ct-no">- ${i+1} / ${pages.length} -</div></div></div>`);
}
async function ctPdf(c,rrn){

 try{await document.fonts.ready}catch(e){}
 const box=document.createElement('div');box.style.cssText='position:absolute;left:-10000px;top:0;background:#fff';box.innerHTML=paginate(c,rrn).join('');document.body.appendChild(box);
 const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
 const pgs=[...box.querySelectorAll('.ct-pg')];
 for(let i=0;i<pgs.length;i++){const cv=await window.html2canvas(pgs[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297)}

}

function bindSort(t){if(t.dataset.sb)return;t.dataset.sb=1;const ths=t.querySelectorAll('thead th');ths.forEach((th,ci)=>{if(!th.textContent.trim())return;th.classList.add('sortable');th.tabIndex=0;
 const go=()=>{const tb=t.tBodies[0];if(!tb)return;tb.querySelectorAll('tr.grp,tr.splitrow,tr.rcrow').forEach(r=>r.remove());const dir=th.dataset.dir==='asc'?'desc':'asc';ths.forEach(x=>{delete x.dataset.dir;x.removeAttribute('aria-sort')});th.dataset.dir=dir;th.setAttribute('aria-sort',dir==='asc'?'ascending':'descending');
  const val=tr=>{const c=tr.children[ci];if(!c)return '';const s=c.textContent.trim();if(/^(–|-|미판매|경과)$/.test(s))return dir==='asc'?Infinity:-Infinity;const n=s.replace(/[,\s]/g,'').match(/^-?\d+(\.\d+)?/);return n&&!/^\d{4}-\d{2}-\d{2}/.test(s)?parseFloat(n[0]):s};
  const rows=[...tb.rows];if(rows.length<2)return;rows.sort((a,b)=>{const x=val(a),y=val(b);const r=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'ko');return dir==='asc'?r:-r});rows.forEach(r=>tb.appendChild(r))};

  const col=g=>{const gm=inOrg(sub(g.id)), gh=inOrg([g.id]).sort(byRank);
    return `<div class="ocol"><div class="gbox${isSel('g',g.id)}" data-k="g" data-id="${g.id}"><b>${esc(g.name)}</b><span>${gh.map(e=>esc(e.name)+' '+esc(pn(e))).join(' · ')||'&nbsp;'}</span><em>${gm.length}명</em>${btns(`<button data-a="addt" data-id="${g.id}">+팀</button><button data-a="ren" data-id="${g.id}">이름</button><button data-a="del" data-id="${g.id}">삭제</button>`)}</div>
     <div class="tlist">${kids(g.id).map(t=>{const tm=inOrg(sub(t.id)), ps=kids(t.id);
       return `<div class="tbox${isSel('t',t.id)}" data-k="t" data-id="${t.id}"><div class="th"><b>${esc(t.name)}</b><em>${tm.length}</em></div><div class="tl">${lead(tm)||'&nbsp;'}</div>
        ${ps.length?`<div class="plist">${ps.map(p=>`<div class="pbox${isSel('p',p.id)}" data-k="p" data-id="${p.id}"><span>${esc(p.name)}</span><em>${inOrg(sub(p.id)).length}</em>${btns(`<button data-a="ren" data-id="${p.id}">이름</button><button data-a="del" data-id="${p.id}">삭제</button>`)}</div>`).join('')}</div>`:''}
        ${btns(`<button data-a="addp" data-id="${t.id}">+파트</button><button data-a="ren" data-id="${t.id}">이름</button><button data-a="del" data-id="${t.id}">삭제</button>`)}</div>`}).join('')}</div></div>`};
  const ceo=inOrg([root.id]).sort(byRank);
  el.innerHTML=head('조직도','조직관리',`재직 ${emps.length}명 · 조직 ${T('org').filter(live).length}개`)+`<div class="invw">
   <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:space-between;margin-bottom:10px"><p class="desc" style="margin:0">${esc(root.name)} → 실 · 사업부 → 팀 → 파트 · 상자를 누르면 아래에 명단${ed?' · 조직 편집에서 조직을 만들고 이름을 바꾸고, 명단에서 인원을 옮깁니다':''}</p>

    $('#ocMem',el).innerHTML=`<h2 style="font-size:15px">${esc(title)} <span class="note">${list.length}명</span></h2><div class="tbl"><table><thead><tr><th>이름</th><th>직책</th><th>팀</th><th>파트</th><th>사번</th><th>법인</th><th>이메일</th><th>연락처</th>${E?'<th>팀 이동</th><th>파트</th>':''}</tr></thead><tbody>${list.map(e=>{const x=teamOf(e), ps=kids(x.tid).filter(p=>p.type==='파트');
      return `<tr><td><b>${esc(e.name)}</b></td><td>${esc(pn(e))}</td><td>${esc(x.t||(x.g?'('+x.g+')':'대표이사'))}</td><td>${esc(x.p||'–')}</td><td>${esc(e.no||'')}</td><td>${esc(byId('corp',e.corp)?.short||'')}</td><td>${esc(e.email?(String(e.email).includes('@')?e.email:e.email+'@gcway.com'):'')}</td><td>${esc(e.phone||'–')}</td>
       ${E?`<td><select class="mt" data-id="${e.id}" aria-label="${esc(e.name)} 팀 이동">${opt.replace(`value="${x.tid}"`,`value="${x.tid}" selected`)}</select></td><td>${ps.length?`<select class="mp" data-id="${e.id}" data-t="${x.tid}" aria-label="${esc(e.name)} 파트"><option value="">없음</option>${ps.map(p=>`<option value="${p.id}" ${p.id===x.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:'–'}</td>`:''}</tr>`}).join('')||`<tr><td colspan="10" class="note">소속 인원이 없습니다</td></tr>`}</tbody><tfoot><tr><td>합계</td><td colspan="${E?9:7}">${list.length}명</td></tr></tfoot></table></div>`;
    const move=(e,to)=>{ if(!to||to===e.org) return; const from=orgPath(e.org), dest=orgPath(to); e.org=to; (e.hist||(e.hist=[])).push({d:TODAY,k:'부서 이동',v:`${from} → ${dest}`,by:S.user.name}); audit('emp',e.id,'부서 이동',`${e.name}: ${from} → ${dest}`); save(); re() };

  draw();

  if($('#pxl',el)) $('#pxl',el).onclick=()=>{ if(typeof XLSX==='undefined') return toast('엑셀 도구를 불러오지 못했습니다. 새로 고침 후 다시 시도하세요.');
    const L=list(), A=[PCOLS.map(c=>c[1]),...L.map(e=>{const r=prow(e);return PCOLS.map(c=>r[c[0]])})];
    const ws=XLSX.utils.aoa_to_sheet(A); ws['!cols']=PCOLS.map(c=>({wch:['email','g','t'].includes(c[0])?22:12})); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'직원 명부');
    XLSX.writeFile(wb,`직원명부_${TODAY}.xlsx`); audit('emp','-','엑셀 받기',L.length+'명') };
  if($('#padd',el)) $('#padd',el).onclick=()=>empEdit(null,()=>VIEWS.people(el));
  if($('#pup',el)){ $('#pup',el).onclick=()=>$('#pupf',el).click(); $('#pupf',el).onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
    try{ const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}); const A=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,dateNF:'yyyy-mm-dd'});
      bulkPreview(A,()=>VIEWS.people(el)) }catch(x){ toast('엑셀을 읽지 못했습니다: '+x.message) } } }
};
