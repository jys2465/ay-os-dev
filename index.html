<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AY-ON 에이온</title><meta name="description" content="주식회사 아연 업무 포털 에이온">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Sora:wght@300;500;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=1.0.0"></script>
<style>

/* Layout: 개발기 띠 → 상단바(로고 · 중앙 PC/모바일 전환 · 사용자) → 좌측 메뉴 + 본문 / 모바일은 폭 420 프레임 + 하단 탭 */
:root{
  --navy:#16233F; --navy-2:#24345A; --accent:#E4572E; --accent-soft:#FDEEE8;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F7F8FB; --line:#DDE2EA; --fg:#1B2233; --muted:#5E6878; --faint:#8A93A3;
  --ok:#2E7D5B; --ok-soft:#E6F3EC; --warn:#B7791F; --warn-soft:#FBF1DE; --bad:#C2372B; --bad-soft:#FBE7E5; --info:#2F5DA8; --info-soft:#E7EEF9;
  --dev:#C2372B;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0E1729; --navy-2:#1C2A47; --accent:#F0704A; --accent-soft:#3A2420;
  --bg:#0F1420; --surface:#171E2D; --surface-2:#1C2435; --line:#2A3448; --fg:#E7EBF2; --muted:#A3ADBF; --faint:#7C879B;
  --ok:#5CC08F; --ok-soft:#183126; --warn:#E3AE58; --warn-soft:#352A16; --bad:#F07A6E; --bad-soft:#3A1E1C; --info:#79A3E8; --info-soft:#1B2840; --dev:#D9483B; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0E1729; --navy-2:#1C2A47; --accent:#F0704A; --accent-soft:#3A2420;
  --bg:#0F1420; --surface:#171E2D; --surface-2:#1C2435; --line:#2A3448; --fg:#E7EBF2; --muted:#A3ADBF; --faint:#7C879B;
  --ok:#5CC08F; --ok-soft:#183126; --warn:#E3AE58; --warn-soft:#352A16; --bad:#F07A6E; --bad-soft:#3A1E1C; --info:#79A3E8; --info-soft:#1B2840; --dev:#D9483B; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--dev)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* dev banner */
.devbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--dev);color:#fff;font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:5px}
.devbar b{letter-spacing:.06em}
.devbar label{display:flex;gap:6px;align-items:center;margin-left:auto;cursor:pointer}
.devbar .sep{opacity:.6}

/* login */
.login{min-height:calc(100% - 30px);display:grid;place-items:center;padding-block:32px}
.login-wrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,300px);gap:24px;align-items:start;width:100%;max-width:720px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.login-card{padding:32px 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.brand svg{flex:none}
.login-card h1{font-size:20px;margin:20px 0 4px;text-wrap:balance}
.login-card p.sub{color:var(--muted);margin:0 0 22px;font-size:13px}
.field{display:grid;gap:6px;margin-bottom:14px;position:relative}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-height:42px}
.inp:focus-within{border-color:var(--navy-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--info) 18%,transparent)}
.inp input{flex:1;min-width:0;border:0;background:transparent;padding:10px 12px;outline:none}
.who{margin-right:8px;background:var(--info-soft);color:var(--info);font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.eye{border:0;background:transparent;padding:8px 10px;color:var(--muted);display:grid;place-items:center}
.eye:hover{color:var(--fg)}
.recent{position:absolute;top:100%;left:0;right:0;margin-top:4px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(10,20,40,.12);padding:4px}
.recent .h{font-size:11px;color:var(--faint);padding:6px 8px 2px}
.recent button{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;background:transparent;padding:8px;border-radius:4px;text-align:left}
.recent button:hover,.recent button.on{background:var(--surface-2)}
.recent .x{color:var(--faint);font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:700;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.block{width:100%;padding:11px}
.msg{font-size:12px;margin:-4px 0 12px;min-height:18px}
.msg.err{color:var(--bad)} .msg.info{color:var(--info)}
.demo{padding:20px}
.demo h2{font-size:13px;margin:0 0 4px}
.demo p{color:var(--muted);font-size:12px;margin:0 0 12px}
.demo table{width:100%;border-collapse:collapse;font-size:12px}
.demo td{padding:7px 4px;border-top:1px solid var(--line)}
.demo td:first-child{font-family:var(--f-num)}
.demo button{border:0;background:none;color:var(--info);font-weight:700;font-size:12px;padding:0}

/* app shell */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 27px);z-index:40;background:var(--navy);color:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:8px}
.top .brand{color:#fff;font-size:14px}
.seg{justify-self:center;display:inline-flex;background:rgba(255,255,255,.1);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;color:#C9D1DF;padding:5px 16px;border-radius:99px;font-size:12px;font-weight:700}
.seg button.on{background:var(--accent);color:#fff}
.me{justify-self:end;display:flex;align-items:center;gap:10px;font-size:12px}
.me .role{background:rgba(255,255,255,.12);padding:2px 8px;border-radius:99px}
.me button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px}
.idle{color:#C9D1DF;font-size:11px}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100% - 80px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:11px;color:var(--faint);padding:12px 10px 4px;letter-spacing:.04em}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:6px;font-weight:500;color:var(--fg)}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav.sub{padding-left:22px;font-size:13px}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--surface-2);color:var(--faint);border:1px solid var(--line);white-space:nowrap}
.tag.p1{background:var(--accent);color:#fff;border-color:var(--accent)}
.main{padding-block:22px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.ph h1{font-size:22px;margin:0;text-wrap:balance}
.ph .eb{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.ph .meta{color:var(--muted);font-size:12px}

/* mobile mode */
.mobile .shell{grid-template-columns:minmax(0,1fr);justify-items:center;background:var(--bg)}
.mobile .side{display:none}
.mobile .main{width:100%;max-width:420px;padding-bottom:84px}
.mobile .top{grid-template-columns:auto 1fr auto}
.mobile .top .brand span{display:none}
.mobile .me .nm,.mobile .me .idle{display:none}
.tabbar{display:none}
.mobile .tabbar{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;border:0;background:transparent;padding:9px 2px 8px;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tabbar button.on{color:var(--accent);font-weight:700}
.tabbar i{font-style:normal;width:22px;height:4px;border-radius:2px;background:currentColor;opacity:.5}
.tabbar .on i{opacity:1}
@media (min-width:700px){.mobile .main{border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--bg);min-height:100%}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left}
button.kpi:hover{border-color:var(--muted)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-num);font-size:24px;font-weight:500;line-height:1.2;margin-top:4px}
.kpi .s{font-size:11px;color:var(--faint)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.mobile .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.mobile .grid2{grid-template-columns:minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel>.hd h2{font-size:14px;margin:0}
.panel>.bd{padding:12px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:11px;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t .c{text-align:center}
.t .nw{white-space:nowrap}
.t small{color:var(--faint);display:block;font-size:11px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.done{background:var(--info-soft);color:var(--info)} .pill.mute{background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.bar{height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden;min-width:70px}
.bar>span{display:block;height:100%;background:var(--navy-2)}
.bar.ok>span{background:var(--ok)} .bar.warn>span{background:var(--warn)} .bar.bad>span{background:var(--bad)} .bar.done>span{background:var(--info)}
.pg{display:flex;align-items:center;gap:8px}
.pg .num{font-size:12px;width:34px;text-align:right}

/* mobile list rendering of table */
.mlist{display:none}
.mobile .tw.hasm{display:none}
.mobile .mlist{display:grid;gap:8px;padding:10px}
.mi{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface);text-align:left;display:grid;gap:6px;width:100%}
.mi .r{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.mi b{font-size:13px;color:var(--fg)}

/* dept */
.depts{display:grid;gap:8px}
.dept{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:left;width:100%}
.dept:hover{border-color:var(--muted)}
.dept b{font-size:13px}
.dept .lead{font-size:11px;color:var(--faint)}
.dept .last{grid-column:1/-1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dept.none{border-style:dashed}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.45);z-index:70;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(520px,100%);height:100%;background:var(--surface);overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;display:grid;align-content:start;gap:16px}
.modal{width:min(440px,100%);background:var(--surface);border-radius:10px;padding:22px;display:grid;gap:12px;max-height:100%;overflow:auto}
.drawer h2,.modal h2{font-size:17px;margin:0;text-wrap:balance}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl .it{position:relative;padding:0 0 14px 16px;font-size:13px}
.tl .it::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--navy-2)}
.tl .it.last::before{border-color:var(--accent);background:var(--accent)}
.tl .when{font-size:11px;color:var(--faint)}
.form{display:grid;gap:10px}
.form label{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:4px}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);font-weight:400;color:var(--fg);width:100%}
.form textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:90;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.count{font-family:var(--f-num);font-size:40px;text-align:center;color:var(--accent)}

/* placeholder */
.wip{display:grid;place-items:center;text-align:center;padding:64px 16px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);gap:8px}
.wip .ic{width:48px;height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--faint);font-weight:800}
.wip h2{margin:0;font-size:18px}
.wip p{margin:0;color:var(--muted);font-size:13px;max-width:40ch}

.note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}


.h3{font-size:13px;margin:0 0 8px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;min-width:880px}
.mobile .kan{grid-template-columns:minmax(0,1fr);min-width:0}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;gap:6px;align-content:start}
.col .ch{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 2px 4px}
.cc{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px;font-size:12px;color:var(--muted)}
.cc:hover{border-color:var(--muted)}
.cc b{color:var(--fg);font-size:13px}
.cc .ft{font-size:11px;color:var(--faint)}
.cc .pill{justify-self:start}
.empty{font-size:12px;color:var(--faint);text-align:center;padding:10px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{flex:1;min-width:64px;text-align:center;font-size:11px;padding:5px 4px;border-radius:4px;background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.steps span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ivs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-size:13px}
.ivs label{display:flex;gap:6px;align-items:center}
.big{width:170px;height:170px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-content:center;gap:4px;margin:6px 0}
.big b{font-size:22px} .big span{font-size:12px;color:#C9D1DF}
.big.done{background:var(--accent)}
.mobile .grid2[style]{grid-template-columns:minmax(0,1fr)!important}
@media (max-width:1100px){.grid2[style]{grid-template-columns:minmax(0,1fr)!important}}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree{padding:6px 0}
.tn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding-block:7px;padding-right:14px;font-size:13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
button.tn:hover{background:var(--surface-2)}
.tn .car{width:12px;color:var(--accent)}
.tn .tl2{color:var(--muted);font-size:12px}
.tn .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.tn.person{color:var(--fg);background:var(--surface-2)}


.tn .acts{display:flex;gap:6px;margin-left:8px}
.pchip{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:1px 0;white-space:nowrap}
.t.pm td,.t.pm th{padding:6px 8px}
.t.pm select{padding:4px 6px}
.btn[disabled]{cursor:not-allowed}


.sfx{color:var(--faint);font-size:13px;padding-right:10px;font-family:var(--f-num)}
.hint{font-size:11px;color:var(--faint)}
.kinds{display:grid;gap:8px}
.kind{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px}
.kind:hover{border-color:var(--accent);background:var(--accent-soft)}
.kind span{font-size:12px;color:var(--muted);font-weight:400}
.ctrow{display:flex;flex-wrap:wrap;gap:4px 14px;padding-block:4px 8px;padding-right:14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--surface)}
.ct b{color:var(--fg);font-weight:500}


.cardtop{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ph-wrap{display:grid;gap:6px;justify-items:center}
.ph-wrap img,.noph{width:96px;height:120px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.noph{display:grid;place-items:center;background:var(--surface-2);font-size:34px;font-weight:800;color:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dot.co,.sec.co>.hd{background:var(--surface-2)} .dot.dme{background:var(--info-soft);border:1px solid var(--info)} .dot.ck{background:var(--warn-soft);border:1px solid var(--warn)}
.dot.co{border:1px solid var(--muted)}
.sec.sme>.hd{background:var(--info-soft)} .sec.ck>.hd{background:var(--warn-soft)}

  const orgs=e?orgUp(e.org):[]; const gs=T('grant').filter(g=>(g.tt==='개인'&&g.tg===u.id)||(g.tt==='부서'&&orgs.includes(g.tg))).filter(g=>g.from<=TODAY&&(!g.to||g.to>=TODAY));
  return [...new Set([...(u.ext?[]:['R-BASE']),...(u.roles||[]),...gs.map(g=>g.role)])].map(id=>byId('role',id)).filter(Boolean)}
const isAdmin=()=>myRoles().some(r=>r.id==='R-ADMIN');
function can(menu,act='조회'){ if(!S.user) return false; if(isAdmin()) return true; return myRoles().some(r=>(r.perm[menu]||[]).includes(act)||(r.perm['*']||[]).includes(act)) }

/* ---------- 공통 UI ---------- */
function modal(html,onOpen,wide){const d=document.createElement('div');d.className='scrim center';d.innerHTML=`<form class="modal form ${wide?'wide':''}" novalidate>${html}</form>`;document.body.append(d);
  d.addEventListener('mousedown',e=>{if(e.target===d)d.remove()}); $$('[data-x]',d).forEach(b=>b.onclick=()=>d.remove());
  const k=e=>{if(e.key==='Escape'){d.remove();removeEventListener('keydown',k)}}; addEventListener('keydown',k);
  onOpen&&onOpen(d.firstChild,d); const f=$('input:not([type=hidden]):not([readonly]),select,textarea',d); f&&f.focus(); return d}
function drawer(html){const d=document.createElement('div');d.className='scrim';d.innerHTML=`<aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`;document.body.append(d);
  d.addEventListener('mousedown',e=>{if(e.target===d)d.remove()}); $$('[data-close]',d).forEach(b=>b.onclick=()=>d.remove());
  const k=e=>{if(e.key==='Escape'&&!$('.scrim.center')){d.remove();removeEventListener('keydown',k)}}; addEventListener('keydown',k); return d}
function ask(title,msg,ok,cb,reason){modal(`<h2>${title}</h2><p class="pmeta" style="font-size:13px;color:var(--fg)">${msg}</p>${reason?'<label for="ask0">사유 <span class="req">필수</span><textarea id="ask0" required></textarea></label>':''}<div class="actions"><button type="button" class="btn" data-x>취소</button><button class="btn acc">${ok}</button></div>`,(f,d)=>{f.onsubmit=e=>{e.preventDefault(); const r=reason?$('#ask0',f).value.trim():''; if(reason&&!r){$('#ask0',f).focus();return} d.remove(); cb(r)}})}
function pill(st,map){const c=(map&&map[st])||STC[st]||'mute';return `<span class="pill ${c}">${esc(st)}</span>`}
const STC={'작성':'mute','임시저장':'mute','결재중':'warn','승인':'ok','반려':'bad','회수':'mute','게시':'ok','내림':'mute','예약':'warn','사용':'ok','사용 중지':'mute','재직':'ok','퇴사':'bad','퇴사 예정':'warn','휴직':'warn','입고완료':'done','매입확정':'done','지급완료':'ok','출고완료':'done','정산완료':'ok','취소':'bad','체결':'ok','만료':'mute','해지':'bad','만료 임박':'warn','확정':'ok','완료':'ok','진행':'done','지연':'bad','주의':'warn','정상':'ok','대기':'warn','팀장 확인':'warn','인사 승인 대기':'done','요청 취소':'mute','마감':'ok','미마감':'warn','접수':'mute','서류합격':'done','1차합격':'done','최종합격':'ok','입사확정':'ok','불합격':'bad','보류':'warn'};
function head(t,eb,meta=''){return `<div class="ph"><div><div class="eb">${eb}</div><h1>${t}</h1></div><div class="meta">${meta}</div></div>`}
function admBar(html,label='관리 기능'){return `<div class="admbar"><b>${label}</b><div class="actions" style="justify-content:flex-start">${html}</div></div>`}
function opts(list,sel,empty){return (empty!==undefined?`<option value="">${empty}</option>`:'')+list.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(sel??'')?'selected':''}>${esc(l)}</option>`}).join('')}

/* =====================================================================
   스키마 엔진
   ENT[key] = { n:이름, menu:권한키, prefix:번호접두, fields:[...], cols:[...], search:[...],
                flow:{init, steps:[...], moves:[...]}, approval:{title,amount,line}, del:(r)=>사유|null,
                use:true(사용 여부 필드), group:'목록 필터 기준', detailExtra:(r)=>html, afterSave }
   field = { k, l, t:text|num|money|date|sel|ref|area|chk|lines|email|tel, opt, ref, req, def, ro, show, hint, w }
   ===================================================================== */
const ENT={};
function fieldOpts(f,r){ if(f.ref){ const E=ENT[f.ref]; return T(f.ref).filter(x=>!E.use||x.use!=='사용 중지'||x.id===r?.[f.k]).filter(x=>!f.where||f.where(x,r)).map(x=>[x.id,E.label?E.label(x):x.name]) } return typeof f.opt==='function'?f.opt(r):(f.opt||[]) }
function refName(k,id){ if(!id) return ''; const r=byId(k,id); return r?(ENT[k].label?ENT[k].label(r):r.name):'(삭제됨)' }
function fmt(f,v,r){ if(v===undefined||v===null||v==='') return '<span class="faint">-</span>';
  if(f.t==='money') return `<span class="num">${won(v)}</span>`; if(f.t==='num') return `<span class="num">${Number(v).toLocaleString('ko-KR')}</span>`;
  if(f.t==='date') return `<span class="num">${esc(v)}</span>`; if(f.ref) return esc(refName(f.ref,v)); if(f.t==='chk') return v?'예':'아니오';
  if(f.t==='lines') return `${v.length}개 품목`; if(f.fmt) return f.fmt(v,r); return esc(v)}
function lineTotal(lines){return (lines||[]).reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0)}

/* ---------- 목록 ---------- */
function renderList(k,el,o={}){
  const E=ENT[k]; const st=S.flt[k]||(S.flt[k]={q:'',s:'',corp:''});
  if(!can(E.menu)) return noPerm(el,E.n);
  let rows=T(k).slice();
  if(E.scope) rows=rows.filter(E.scope);
  if(o.filter) rows=rows.filter(o.filter);
  const states=E.flow?E.flow.steps.concat(E.flow.extra||[]):(E.use?['사용','사용 중지']:[]);
  const sk=E.flow?'status':(E.use?'use':null);
  const counts=sk?Object.fromEntries(states.map(s=>[s,rows.filter(r=>r[sk]===s).length])):{};
  if(st.s&&sk) rows=rows.filter(r=>r[sk]===st.s);
  if(st.corp&&E.fields.some(f=>f.k==='corp')) rows=rows.filter(r=>r.corp===st.corp);
  if(st.q){const q=st.q.toLowerCase(); rows=rows.filter(r=>(E.search||['name','no']).some(s=>{const f=E.fields.find(x=>x.k===s); const v=f&&f.ref?refName(f.ref,r[s]):r[s]; return String(v??'').toLowerCase().includes(q)}))}
  rows.sort(E.sort||((a,b)=>String(b.date||b.no||'').localeCompare(String(a.date||a.no||''))));
  const cols=E.cols.map(c=>E.fields.find(f=>f.k===c)||{k:c,l:c});
  const sum=E.sumKey?rows.reduce((a,r)=>a+(+(typeof E.sumKey==='function'?E.sumKey(r):r[E.sumKey])||0),0):null;
  el.innerHTML=(o.noHead?'':head(E.n,E.eb||'',E.lead||''))+(o.top||'')+
  `<section class="panel"><div class="hd">
     <div class="filters"><input id="fq" placeholder="${esc((E.search||['name']).map(s=>(E.fields.find(f=>f.k===s)||{l:s}).l).join(' · '))} 검색" value="${esc(st.q)}" aria-label="검색">
       ${E.fields.some(f=>f.k==='corp')?`<select id="fcorp" aria-label="법인">${opts(T('corp').map(c=>[c.id,c.name]),st.corp,'전체 법인')}</select>`:''}</div>
     <div class="actions">${can(E.menu,'등록')&&!E.noAdd?`<button class="btn sm acc" id="fadd">${E.addLabel||E.n+' 등록'}</button>`:''}</div></div>
   ${sk?`<div class="stbar"><button class="chip ${!st.s?'on':''}" data-fs="">전체 <span class="num">${Object.values(counts).reduce((a,b)=>a+b,0)}</span></button>${states.map(s=>`<button class="chip ${st.s===s?'on':''}" data-fs="${s}">${s} <span class="num">${counts[s]}</span></button>`).join('')}</div>`:''}
   <div class="tw"><table class="t"><thead><tr>${cols.map(c=>`<th class="${c.t==='money'||c.t==='num'?'r':''}">${esc(c.l)}</th>`).join('')}${sk?'<th class="c">상태</th>':''}</tr></thead><tbody>
   ${rows.map(r=>`<tr class="click" tabindex="0" data-id="${r.id}">${cols.map((c,i)=>`<td class="${c.t==='money'||c.t==='num'?'r':''} ${i<2?'nw':''}">${i===0?'<b>':''}${c.v?c.v(r):fmt(c,c.t==='money'&&c.calc?c.calc(r):r[c.k],r)}${i===0?'</b>':''}</td>`).join('')}${sk?`<td class="c">${pill(r[sk])}</td>`:''}</tr>`).join('')||`<tr><td colspan="${cols.length+1}" class="empty">${E.empty||'등록된 항목이 없습니다.'}</td></tr>`}
   </tbody>${sum!==null?`<tfoot><tr><td colspan="${cols.length+(sk?1:0)}" class="r">합계 <b class="num">${won(sum)}</b> 원 · ${rows.length}건</td></tr></tfoot>`:''}</table></div></section>${o.bottom||''}`;
  const re=()=>renderList(k,el,o);
  const q=$('#fq',el); q.oninput=()=>{st.q=q.value; re(); const n=$('#fq',el); n.focus(); n.setSelectionRange(n.value.length,n.value.length)};
  $('#fcorp',el)&&($('#fcorp',el).onchange=e=>{st.corp=e.target.value;re()});
  $$('[data-fs]',el).forEach(b=>b.onclick=()=>{st.s=b.dataset.fs;re()});
  $('#fadd',el)&&($('#fadd',el).onclick=()=>openForm(k,null,re,o.defaults));
  $$('tr[data-id]',el).forEach(tr=>{tr.onclick=()=>openDetail(k,tr.dataset.id,re); tr.onkeydown=e=>{if(e.key==='Enter')openDetail(k,tr.dataset.id,re)}});

function noPerm(el,n){el.innerHTML=head(n,'')+`<section class="wip"><div class="ic">!</div><h2>권한이 없습니다</h2><p>이 메뉴를 쓰려면 시스템 관리자에게 권한을 요청하세요.</p></section>`}

/* ---------- 등록 · 수정 폼 ---------- */
function inputFor(f,v,r){const id='f_'+f.k, ro=f.ro||(r&&f.lock&&f.lock(r)), req=f.req?' <span class="req">필수</span>':'';
  const lab=`<label for="${id}" class="${f.w==='full'||f.t==='area'||f.t==='lines'?'wide':''}">${esc(f.l)}${req}${f.hint?`<span class="hint2">${esc(f.hint)}</span>`:''}`;
  if(f.t==='lines') return ro?`<div class="wide"><div class="lab">${esc(f.l)} <i class="lk">잠금</i></div><div class="note">${(v||[]).map(l=>esc(refName('item',l.item))+' '+l.qty+'개 × '+won(l.price)).join('<br>')}</div></div>`:`<div class="wide"><div class="lab">${esc(f.l)}${req}</div>${linesEditor(f,v||[])}</div>`;
  if(f.t==='area') return `${lab}<textarea id="${id}" ${ro?'readonly':''}>${esc(v??'')}</textarea></label>`;
  if(f.t==='chk') return `<label class="chkl" for="${id}"><input type="checkbox" id="${id}" ${v?'checked':''} ${ro?'disabled':''}> ${esc(f.l)}</label>`;
  if(f.ref||f.t==='sel') return `${lab}<select id="${id}" ${ro?'disabled':''}>${opts(fieldOpts(f,r),v,f.req?undefined:'선택 안 함')}</select></label>`;
  const type={money:'number',num:'number',date:'date',email:'email',tel:'tel'}[f.t]||'text';
  return `${lab}<input id="${id}" type="${type}" ${f.t==='money'||f.t==='num'?'step="any" inputmode="numeric"':''} value="${esc(v??'')}" ${ro?'readonly':''} placeholder="${esc(f.ph||'')}"></label>`}
function linesEditor(f,lines){const items=T('item').filter(i=>i.use!=='사용 중지');
  return `<div class="lines" data-lines="${f.k}"><table class="t lt"><thead><tr><th>품목</th><th class="r" style="width:90px">수량</th><th class="r" style="width:120px">${f.priceLabel||'단가'}</th><th class="r" style="width:120px">금액</th><th style="width:40px"></th></tr></thead><tbody>
   ${(lines.length?lines:[{item:'',qty:1,price:0}]).map(l=>lineRow(items,l,f)).join('')}</tbody>
   <tfoot><tr><td><button type="button" class="btn sm" data-addline>품목 추가</button></td><td colspan="2" class="r">합계</td><td class="r num" data-ltot>${won(lineTotal(lines))}</td><td></td></tr></tfoot></table></div>`}
function lineRow(items,l,f){return `<tr><td><select data-li="item" aria-label="품목">${opts(items.map(i=>[i.id,`${i.name} (${refName('brand',i.brand)})`]),l.item,'품목 선택')}</select></td><td><input data-li="qty" type="number" min="0" value="${l.qty??1}" aria-label="수량" class="r"></td><td><input data-li="price" type="number" min="0" value="${l.price??0}" aria-label="단가" class="r"></td><td class="r num" data-lsum>${won((+l.qty||0)*(+l.price||0))}</td><td><button type="button" class="btn sm" data-delline aria-label="행 삭제">✕</button></td></tr>`}
function bindLines(form,f){const box=$(`[data-lines="${f.k}"]`,form); if(!box) return; const items=T('item').filter(i=>i.use!=='사용 중지');
  const recalc=()=>{let t=0; $$('tbody tr',box).forEach(tr=>{const q=+$('[data-li=qty]',tr).value||0,p=+$('[data-li=price]',tr).value||0; $('[data-lsum]',tr).textContent=won(q*p); t+=q*p}); $('[data-ltot]',box).textContent=won(t)};
  box.addEventListener('input',recalc);
  box.addEventListener('change',e=>{ if(e.target.dataset.li==='item'){const it=byId('item',e.target.value); const pr=$('[data-li=price]',e.target.closest('tr')); if(it&&(!+pr.value)) pr.value=f.priceFrom==='sale'?it.salePrice:it.cost||0; recalc()} });
  box.addEventListener('click',e=>{ if(e.target.matches('[data-addline]')){$('tbody',box).insertAdjacentHTML('beforeend',lineRow(items,{item:'',qty:1,price:0},f))} if(e.target.matches('[data-delline]')){ if($$('tbody tr',box).length>1) e.target.closest('tr').remove(); recalc()} })}
function readLines(form,f){return $$(`[data-lines="${f.k}"] tbody tr`,form).map(tr=>({item:$('[data-li=item]',tr).value,qty:+$('[data-li=qty]',tr).value||0,price:+$('[data-li=price]',tr).value||0})).filter(l=>l.item&&l.qty>0)}
function openForm(k,id,re,defaults){
  const E=ENT[k], r=id?byId(k,id):null, edit=!!r;
  if(edit&&E.editable&&!E.editable(r)) return toast(E.lockMsg||'지금 상태에서는 수정할 수 없습니다.');
  if(edit&&E.lockClosed&&isClosed(r[E.dateKey||'date'])) return toast('마감된 달의 기록은 고칠 수 없습니다. 월 마감을 해제한 뒤 고치세요.');
  const base=edit?r:Object.assign({},...E.fields.filter(f=>f.def!==undefined).map(f=>({[f.k]:typeof f.def==='function'?f.def():f.def})),defaults||{});
  const fs=E.fields.filter(f=>!f.hide&&(!f.show||f.show(base)));
  modal(`<h2>${E.n} ${edit?'수정':'등록'}${edit&&r.no?` <span class="pmeta num">${r.no}</span>`:''}</h2><div class="fgrid2">${fs.map(f=>inputFor(f,base[f.k],base)).join('')}</div>
   <div class="msg err" id="fmsg"></div><div class="actions"><button type="button" class="btn" data-x>취소</button><button class="btn pri">${edit?'저장':'등록'}</button></div>`,(form,d)=>{
    fs.filter(f=>f.t==='lines').forEach(f=>bindLines(form,f));
    form.onsubmit=ev=>{ev.preventDefault(); const v={}; const m=$('#fmsg',form);
      for(const f of fs){ if(f.ro||(r&&f.lock&&f.lock(r))) continue; const el=$('#f_'+f.k,form);
        if(f.t==='lines') v[f.k]=readLines(form,f); else if(f.t==='chk') v[f.k]=el.checked; else if(f.t==='money'||f.t==='num') v[f.k]=el.value===''?'':+el.value; else v[f.k]=el.value.trim();
        if(f.req&&(v[f.k]===''||v[f.k]===undefined||(Array.isArray(v[f.k])&&!v[f.k].length))){m.textContent=`${f.l}을(를) 입력하세요.`; (el||form).focus&&el&&el.focus(); return}
        if(f.unique&&T(k).some(x=>x!==r&&String(x[f.k]).toLowerCase()===String(v[f.k]).toLowerCase())){m.textContent=`같은 ${f.l}이(가) 이미 있습니다.`; return}
        if(f.valid){const msg=f.valid(v[f.k],v,r); if(msg){m.textContent=msg; return}} }
      if(E.validate){const msg=E.validate(v,r); if(msg){m.textContent=msg;return}}
      if(E.lockClosed&&isClosed(v[E.dateKey||'date'])){m.textContent='마감된 달의 날짜로는 등록 · 수정할 수 없습니다.';return}
      if(edit){ const ch=fs.filter(f=>!f.ro&&JSON.stringify(r[f.k])!==JSON.stringify(v[f.k])).map(f=>f.l); E.beforeUpdate&&E.beforeUpdate(r,v); Object.assign(r,v); r.updated=STAMP(); audit(k,r.id,'수정',ch.join(', ')||'변경 없음') }
      else { const n={id:uid(k.slice(0,2).toUpperCase()),...base,...v,created:STAMP(),by:S.user.name,byId:S.user.id}; if(E.prefix) n.no=nextNo(E.prefix,n.date); if(E.flow) n.status=E.flow.init; if(E.use&&!n.use) n.use='사용'; E.beforeCreate&&E.beforeCreate(n); T(k).push(n); audit(k,n.id,'등록',n.no||n.name||''); E.afterCreate&&E.afterCreate(n) }
      save(); d.remove(); toast(edit?'저장했습니다.':'등록했습니다.'); re&&re(); }
  },fs.some(f=>f.t==='lines'||f.t==='area')||fs.length>8);
}

/* ---------- 상세 · 상태 흐름 ---------- */
function moveAllowed(E,mv,r){ if(!mv.from.includes(r.status)) return false; if(E.lockClosed&&isClosed(r[E.dateKey||'date'])) return false; if(mv.guard&&mv.guard(r)===false) return false; return can(E.menu,mv.act||'수정')||(mv.self&&r.byId===S.user.id) }
function openDetail(k,id,re){
  const E=ENT[k], r=byId(k,id); if(!r) return;
  const fs=E.fields.filter(f=>!f.hide&&(!f.show||f.show(r)));
  const steps=E.flow?E.flow.steps:null, si=steps?steps.indexOf(r.status):-1;
  const moves=E.flow?E.flow.moves.filter(m=>moveAllowed(E,m,r)):[];
  const fwd=moves.filter(m=>!m.rev), rev=moves.filter(m=>m.rev);
  const closed=E.lockClosed&&isClosed(r[E.dateKey||'date']);
  const editable=!closed&&can(E.menu,'수정')&&(!E.editable||E.editable(r));
  const delReason=(E.lockClosed&&isClosed(r[E.dateKey||'date']))?'마감된 달의 기록입니다.':(E.flow&&r.appr&&byId('appr',r.appr)?.status==='승인')?'결재가 승인된 문서는 삭제할 수 없습니다. 취소 처리를 하세요.':(E.del?E.del(r):refBlock(k,r));
  const hist=DB.audit.filter(a=>a.ent===k&&a.id===r.id).slice(0,30);
  const appr=r.appr?byId('appr',r.appr):null;
  const d=drawer(`<div class="ph" style="margin:0"><div><div class="eb num">${esc(r.no||E.n)}</div><h2>${esc(E.title?E.title(r):(r.name||r.title||E.n))} ${E.flow?pill(r.status):E.use?pill(r.use):''}</h2></div><button class="btn sm" data-close>닫기</button></div>
   ${steps?`<div class="steps">${steps.map((s,i)=>`<span class="${si>=i&&(E.flow.extra||[]).indexOf(r.status)<0?'on':''}">${s}</span>`).join('')}</div>`:''}

   ${fs.filter(f=>f.t==='area'&&r[f.k]).map(f=>`<div><h3 class="h3">${esc(f.l)}</h3><div class="note" style="color:var(--fg);white-space:pre-wrap">${esc(r[f.k])}</div></div>`).join('')}

  $('[data-openappr]',d)&&($('[data-openappr]',d).onclick=()=>{d.remove(); openAppr(appr.id,re)});
  $$('[data-mv]',d).forEach(b=>b.onclick=()=>{const m=E.flow.moves.find(x=>x.id===b.dataset.mv);

    if(m.approval) return submitAppr(k,r,()=>{done()});
    if(m.confirm||m.rev||m.reason) ask(m.l,m.confirm?m.confirm(r):`${esc(r.no||'')} · ${r.status} → ${m.to||''}`,m.l,go,m.rev||m.reason); else go('') });

/* 참조 무결성: 다른 기록이 쓰고 있으면 삭제 차단 */
function refBlock(k,r){ for(const [ek,E] of Object.entries(ENT)){ for(const f of E.fields){ if(f.ref===k&&T(ek).some(x=>x[f.k]===r.id)) return `${E.n}에서 쓰고 있어 삭제할 수 없습니다.`; if(f.t==='lines'&&k==='item'&&T(ek).some(x=>(x[f.k]||[]).some(l=>l.item===r.id))) return `${E.n}에서 쓰고 있어 삭제할 수 없습니다.` } }
  if(k==='item'&&T('stk').some(m=>m.item===r.id)) return '재고 원장에 기록이 있어 삭제할 수 없습니다.'; if(k==='emp'&&T('user').some(u=>u.emp===r.id)) return '로그인 계정이 연결되어 있어 삭제할 수 없습니다. 퇴사 처리를 하세요.'; return null }
/* =====================================================================
   서버 연결 (Supabase)
   - config.js 에 주소 · 공개키가 있으면 서버 모드, 없으면 브라우저 시연 모드
   - 화면은 지금처럼 메모리의 DB를 쓰고, 바뀐 기록만 골라 서버에 저장
   - 다른 사람이 바꾼 기록은 실시간으로 받아 화면에 반영
   ===================================================================== */
let SB=null; const SNAP=new Map(); let _saveT=null, _saving=null, _rt=null, _rtT=null;
const SEP='\u0001', META=['seq','cfg'], NO_PW=['user','signup'];
if(CLOUD){ try{ SB=window.supabase.createClient(CFG.supabaseUrl,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'ayon.auth.'+ENV}}) }catch(e){ console.error(e) } }
const loginEmail=id=>id.includes('@')?id:id+'@gcway.com';
function emptyDB(){ return {seq:{},audit:[],cfg:{apprCeo:3000000,ctAlert:60,weeklyDue:'매주 금 17:00',wt:{'기본형':['10:00','19:00']}}} }

/* 메모리 DB ↔ 서버 기록(tbl, id, data) */
function toRows(db){ const out=[];
  for(const [k,v] of Object.entries(db)){
    if(META.includes(k)){ out.push(['_meta',k,v]); continue }
    if(!Array.isArray(v)) continue;
    for(const r of v){ const rid=k==='audit'?r.aid:r.id; if(!r||rid==null) continue; let d=r;
      if(NO_PW.includes(k)&&'pw' in d){ d={...d}; delete d.pw }
      if(k==='emp'){ const {card,...rest}=d; out.push(['empcard',r.id,{card:card||{}}]); d=rest }
      out.push([k,String(rid),d]) } }
  return out }
function fromRows(rows){ const db=emptyDB(); const cards={};
  for(const x of rows){ if(x.tbl==='_meta'){ db[x.id]=x.data; continue } if(x.tbl==='empcard'){ cards[x.id]=x.data.card; continue } (db[x.tbl]||(db[x.tbl]=[])).push(x.data) }
  (db.emp||[]).forEach(e=>{ e.card=cards[e.id]||{} });
  db.audit.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  for(const k of Object.keys(db)) if(Array.isArray(db[k])&&k!=='audit') db[k].sort((a,b)=>(a._o??0)-(b._o??0));
  return db }
const keyOf=(t,id)=>t+SEP+id;
const snapStr=(t,d)=>JSON.stringify(d);

/* 전체 불러오기 (권한 안에서 보이는 기록만 옴) */
async function cloudLoad(){ const rows=[]; const step=1000;
  for(let from=0;;from+=step){ const {data,error}=await SB.from('ayon_records').select('tbl,id,data').neq('tbl','audit').order('tbl').order('created_at').order('id').range(from,from+step-1); if(error) throw error; rows.push(...data); if(data.length<step) break }
  const {data:au,error:e2}=await SB.from('ayon_records').select('tbl,id,data').eq('tbl','audit').order('updated_at',{ascending:false}).limit(3000); if(e2) throw e2; rows.push(...au);
  DB=fromRows(rows); SNAP.clear();
  // 비교 기준은 '다시 나눴을 때의 모양'으로 잡아야 불필요한 저장이 없음
  for(const [t,id,d] of toRows(DB)) SNAP.set(keyOf(t,id),snapStr(t,d));
  return DB }

/* 저장: 바뀐 기록만 upsert, 사라진 기록은 delete (변경 이력은 지우지 않음) */
function cloudSave(){ if(!S.user||!SB) return; clearTimeout(_saveT); _saveT=setTimeout(cloudFlush,250); syncState('저장 중') }
async function cloudFlush(){ if(_saving){ await _saving } if(!S.user) return; _saving=(async()=>{
  const ups=[], seen=new Set();
  for(const [t,id,d] of toRows(DB)){ const k=keyOf(t,id); seen.add(k); const s=snapStr(t,d); if(SNAP.get(k)!==s) ups.push({tbl:t,id,data:d,_s:s,_k:k}) }
  const dels={}; for(const k of SNAP.keys()) if(!seen.has(k)){ const [t,id]=k.split(SEP); if(t==='audit'){ SNAP.delete(k); continue } (dels[t]||(dels[t]=[])).push(id) }
  try{
    for(let i=0;i<ups.length;i+=400){ const ch=ups.slice(i,i+400); const {error}=await SB.from('ayon_records').upsert(ch.map(({tbl,id,data})=>({tbl,id,data})),{onConflict:'tbl,id'}); if(error) throw error; ch.forEach(u=>SNAP.set(u._k,u._s)) }
    for(const [t,ids] of Object.entries(dels)) for(let i=0;i<ids.length;i+=200){ const part=ids.slice(i,i+200); const {error}=await SB.from('ayon_records').delete().eq('tbl',t).in('id',part); if(error) throw error; part.forEach(id=>SNAP.delete(keyOf(t,id))) }
    syncState('저장됨')
  }catch(e){ console.error(e); syncState('저장 실패',true); toast('서버 저장에 실패했습니다: '+(e.message||e)+' — 화면을 새로 고친 뒤 다시 시도하세요.') }
 })(); await _saving; _saving=null }
function syncState(t,bad){ const el=$('#sync'); if(el){ el.textContent=t; el.classList.toggle('bad',!!bad) } }

/* 실시간: 다른 사람이 바꾼 기록 반영 */
function cloudRealtime(){ if(_rt) SB.removeChannel(_rt);
  _rt=SB.channel('ayon').on('postgres_changes',{event:'*',schema:'public',table:'ayon_records'},p=>{
    const row=p.new&&p.new.tbl?p.new:p.old; if(!row||!row.tbl) return; const t=row.tbl, id=row.id, k=keyOf(t,id);
    if(p.eventType==='DELETE'){ if(!SNAP.has(k)) return; SNAP.delete(k); if(t==='empcard') return; if(t==='_meta') return; DB[t]=T(t).filter(r=>String(r.id)!==String(id)) }
    else { const s=snapStr(t,p.new.data); if(SNAP.get(k)===s) return; SNAP.set(k,s); const d=p.new.data;
      if(t==='_meta') DB[id]=d;
      else if(t==='empcard'){ const e=byId('emp',id); if(e) e.card=d.card||{} }
      else if(t==='audit'){ if(!DB.audit.some(a=>a.aid===id)) DB.audit.unshift(d) }
      else { const arr=T(t); const i=arr.findIndex(r=>String(r.id)===String(id)); if(t==='emp'){ d.card=i>=0?arr[i].card:{} } if(i>=0) arr[i]=d; else arr.push(d) } }
    clearTimeout(_rtT); _rtT=setTimeout(()=>{ if(!S.user) return; renderBadges&&renderBadges(); if(!$('.scrim')) renderView() },400) }).subscribe() }

/* 로그인 · 로그아웃 */
async function cloudLogin(id,pw,set){
  const {error}=await SB.auth.signInWithPassword({email:loginEmail(id),password:pw});
  if(error){ if(/confirm/i.test(error.message)) return {msg:MAIL?'이메일 인증이 아직 안 됐습니다. 메일함의 인증 메일을 눌러 주세요.':'계정 확인이 안 된 상태입니다. 관리자에게 Supabase 설정(Confirm email 끄기)을 확인해 달라고 요청하세요.',type:'info'}; return {fail:true} }
  try{ await cloudLoad() }catch(e){ await SB.auth.signOut(); return {msg:'서버에서 데이터를 불러오지 못했습니다: '+e.message} }
  const u=T('user').find(x=>x.id===id);
  if(!u||!u.on){ const sr=T('signup').filter(x=>x.uid===id).pop(); await SB.auth.signOut(); DB=emptyDB(); SNAP.clear();
    if(u&&!u.on) return {msg:'사용이 중지된 계정입니다. 인사팀에 문의하세요.'};
    if(sr&&sr.status==='대기') return {msg:'가입 승인 대기 중입니다. 승인 후 로그인할 수 있습니다.',type:'info'};
    if(sr&&sr.status==='반려') return {msg:'가입이 반려되었습니다: '+(sr.why||'')};
    return {msg:'에이온 계정이 없습니다. 가입하기로 신청해 주세요.'} }
  return {u} }
async function cloudLogout(){ clearTimeout(_saveT); try{ if(_rt) SB.removeChannel(_rt); _rt=null; await cloudFlush() }catch(e){} await SB.auth.signOut(); DB=emptyDB(); SNAP.clear() }

/* 메일 사용 여부: config.js 에 mail:true 를 넣으면 인증 · 재설정 메일 방식, 기본은 메일 없이 운영 */
const MAIL=!!CFG.mail;
const PW_RULE='10자 이상, 영문 · 숫자 · 특수문자를 모두 넣으세요.';
const pwOk=p=>p.length>=10&&/[A-Za-z]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9]/.test(p);

/* 가입 신청 (로그인 전) */
async function cloudSignup(r,pw){

  if(e2) return '가입 신청 저장 실패: '+e2.message; return null }
const signupDoneMsg=id=>MAIL?`가입 신청을 보냈습니다. ${loginEmail(id)} 로 온 인증 메일을 누른 뒤, 인사팀 승인이 나면 로그인할 수 있습니다.`:'가입 신청을 보냈습니다. 인사팀 승인이 나면 같은 아이디와 비밀번호로 로그인할 수 있습니다.';

function cloudRecoveryWatch(){ if(!MAIL) return; SB.auth.onAuthStateChange((ev)=>{ if(ev!=='PASSWORD_RECOVERY') return;
  modal(`<h2>새 비밀번호 설정</h2><p class="pmeta">${PW_RULE}</p><label for="np1">새 비밀번호<input id="np1" type="password" required></label><label for="np2">새 비밀번호 확인<input id="np2" type="password" required></label><div class="msg err" id="npm"></div><div class="actions"><button class="btn pri">변경</button></div>`,(f,d)=>{

/* 첫 화면: 저장된 로그인이 살아 있으면 바로 들어감 */
async function cloudBoot(){ DB=emptyDB(); cloudRecoveryWatch();
  if(MAIL&&/type=recovery/.test(location.hash)){ renderLogin(); return }
  const {data}=await SB.auth.getSession(); const em=data?.session?.user?.email;
  if(em){ const id=em.toLowerCase().endsWith('@gcway.com')?em.split('@')[0].toLowerCase():em.toLowerCase();
    try{ await cloudLoad(); const u=T('user').find(x=>x.id===id&&x.on); if(u){ enterApp(u); return } }catch(e){ console.error(e) } await SB.auth.signOut(); DB=emptyDB() }
  renderLogin() }

   전자결재 엔진 · 조직 도우미 · 로그인 · 앱 셸 · 메뉴
   ===================================================================== */
function orgUp(id){const a=[];let o=byId('org',id);while(o){a.push(o.id);o=byId('org',o.parent)}return a}
function orgPath(id){return orgUp(id).reverse().map(x=>byId('org',x).name).join(' > ')}
function empName(id){const e=byId('emp',id);return e?`${e.name} ${dutyOf(e)||posName(e.pos)}`:''}
function posName(id){return byId('pos',id)?.name||''} function dutyName(id){return byId('duty',id)?.name||''}
function dutyOf(e){return e.duty?dutyName(e.duty):''}
function userOfEmp(empId){return T('user').find(u=>u.emp===empId)}
function meEmp(){return S.user?byId('emp',S.user.emp):null}
function leaderOf(orgId){ for(const o of orgUp(orgId)){const org=byId('org',o); if(org.head&&org.head!==S.user?.emp) return org.head} return null }

/* ---------- 전자결재 ---------- */
const APPR_TYPES=['일반 품의','지출결의','구매(발주)','휴가','계약','매출 조정','공지 게시'];
function defaultLine(amount){ const me=meEmp(); const line=[]; if(!me) return line;
  const lead=leaderOf(me.org); if(lead) line.push(lead);
  const lvl1=T('emp').find(e=>e.duty&&byId('duty',e.duty)?.level==='1급'&&orgUp(me.org).includes(e.org)&&e.id!==me.id&&!line.includes(e.id)); if(lvl1) line.push(lvl1.id);
  if((amount||0)>=(DB.cfg.apprCeo||3000000)){const ceo=T('emp').find(e=>e.duty&&byId('duty',e.duty)?.level==='경영'); if(ceo&&!line.includes(ceo.id)) line.push(ceo.id)}
  return line.slice(0,4)}
function apprLineEditor(line){const emps=T('emp').filter(e=>e.status!=='퇴사'&&userOfEmp(e.id));
  return `<div class="aline" id="aline">${[0,1,2,3].map(i=>`<label for="al${i}">${i+1}차 결재자<select id="al${i}">${opts(emps.map(e=>[e.id,empName(e.id)+' · '+(byId('org',e.org)?.name||'')]),line[i]||'','없음')}</select></label>`).join('')}</div>`}
function submitAppr(k,r,cb,extra){ const E=k?ENT[k]:null; const amt=E&&E.approval&&E.approval.amount?E.approval.amount(r):0;
  modal(`<h2>결재 상신</h2><p class="pmeta">${E?esc(E.n)+' · '+esc(r.no||''):''} ${amt?'· 금액 <b class="num">'+won(amt)+'</b>원':''}</p>
   <label for="at">제목<input id="at" required value="${esc(E?E.approval.title(r):'')}"></label>
   <label for="ab">기안 내용<textarea id="ab" placeholder="요청 배경 · 내용 · 기대 효과">${esc(E&&E.approval.body?E.approval.body(r):'')}</textarea></label>
   ${apprLineEditor(defaultLine(amt))}
   <p class="pmeta">기본 결재선: 소속 조직장 → 1급 조직장 → (금액 ${man(DB.cfg.apprCeo)}원 이상) 대표이사. 바꿀 수 있습니다.</p>
   <div class="msg err" id="amsg"></div><div class="actions"><button type="button" class="btn" data-x>취소</button><button class="btn pri">상신</button></div>`,(f,d)=>f.onsubmit=e=>{e.preventDefault();
    const ids=[0,1,2,3].map(i=>$('#al'+i,f).value).filter(Boolean); if(!ids.length){$('#amsg',f).textContent='결재자를 한 명 이상 지정하세요.';return}
    if(new Set(ids).size!==ids.length){$('#amsg',f).textContent='같은 결재자가 두 번 들어 있습니다.';return}
    const a={id:uid('AP'),no:nextNo('AP'),type:E?E.approval.type:'일반 품의',title:$('#at',f).value.trim()||'(제목 없음)',body:$('#ab',f).value,amount:amt,ref:k?{k,id:r.id}:null,drafter:S.user.emp,dept:meEmp()?.org,date:TODAY,created:STAMP(),
      line:ids.map(id=>({emp:id,name:empName(id),st:'대기'})),step:0,status:'결재중',log:[[STAMP(),'상신 · '+S.user.name]],...(extra||{})};
    T('appr').push(a); if(r){r.appr=a.id; r.status='결재중'; audit(k,r.id,'결재 상신',a.no)} audit('appr',a.id,'상신',a.title); save(); d.remove(); toast(`결재를 상신했습니다. (${a.no})`); cb&&cb(a)})}
function apprTarget(a){return a.ref?byId(a.ref.k,a.ref.id):null}
function apprAct(a,act,memo){ const cur=a.line[a.step]; const r=apprTarget(a); const E=a.ref?ENT[a.ref.k]:null; const who=S.user.name+(cur&&cur.emp!==S.user.emp?' (관리자 대리)':'');
  if(act==='승인'){ cur.st='승인'; cur.at=STAMP(); cur.memo=memo; a.log.push([STAMP(),`승인 · ${who}${memo?' · '+memo:''}`]); a.step++;
    if(a.step>=a.line.length){ a.status='승인'; a.done=STAMP(); if(r){ r.status=E.flow.approvedTo||'승인'; E.flow.onApproved&&E.flow.onApproved(r); audit(a.ref.k,r.id,'결재 승인',a.no)} } }
  if(act==='반려'){ cur.st='반려'; cur.at=STAMP(); cur.memo=memo; a.status='반려'; a.log.push([STAMP(),`반려 · ${who} · ${memo}`]); if(r){r.status='반려'; audit(a.ref.k,r.id,'결재 반려',memo)} }
  if(act==='회수'){ a.status='회수'; a.log.push([STAMP(),`회수 · ${who}${memo?' · '+memo:''}`]); if(r){r.status=E.flow.init; r.appr=null; audit(a.ref.k,r.id,'결재 회수',memo)} }
  if(act==='승인 취소'){ const last=[...a.line].reverse().find(l=>l.st==='승인'); if(last){last.st='대기'; a.step=a.line.indexOf(last)} a.status='결재중'; a.log.push([STAMP(),`승인 취소 · ${who} · ${memo}`]); if(r){ E.flow.onUnapproved&&E.flow.onUnapproved(r); r.status='결재중'; audit(a.ref.k,r.id,'결재 승인 취소',memo)} }
  if(act==='반려 취소'){ const l=a.line.find(x=>x.st==='반려'); if(l){l.st='대기'} a.status='결재중'; a.log.push([STAMP(),`반려 취소 · ${who} · ${memo}`]); if(r){r.status='결재중'} }
  audit('appr',a.id,act,memo||''); save(); renderBadges()}
function apprCanAct(a){ if(a.status!=='결재중') return false; const cur=a.line[a.step]; return cur&&(cur.emp===S.user.emp||isAdmin()) }
function openAppr(id,re){ const a=byId('appr',id); if(!a) return; const r=apprTarget(a); const mine=a.drafter===S.user.emp;
  const B=[]; if(apprCanAct(a)) B.push(['승인','pri'],['반려','']);
  if(a.status==='결재중'&&(mine||isAdmin())) B.push(['회수','danger']);
  const R=[]; if(a.status==='승인'&&isAdmin()&&(!r||r.status===(ENT[a.ref?.k]?.flow.approvedTo||'승인'))) R.push('승인 취소'); if(a.status==='반려'&&isAdmin()) R.push('반려 취소');
  const d=drawer(`<div class="ph" style="margin:0"><div><div class="eb num">${a.no} · ${esc(a.type)}</div><h2>${esc(a.title)} ${pill(a.status)}</h2></div><button class="btn sm" data-close>닫기</button></div>
   <div class="aflow">${[{name:empName(a.drafter)+' (기안)',st:'상신'},...a.line].map((l,i)=>`<div class="ast ${l.st==='승인'||l.st==='상신'?'ok':l.st==='반려'?'bad':(i-1===a.step&&a.status==='결재중')?'now':''}"><b>${esc(l.name)}</b><span>${l.st==='대기'&&i-1===a.step&&a.status==='결재중'?'결재 차례':esc(l.st)}${l.at?' · '+l.at.slice(5):''}</span>${l.memo?`<em>${esc(l.memo)}</em>`:''}</div>`).join('<i class="aarr">→</i>')}</div>
   <dl class="kv"><dt>기안자</dt><dd>${esc(empName(a.drafter))} · ${esc(byId('org',a.dept)?.name||'')}</dd><dt>기안일</dt><dd class="num">${a.date}</dd>${a.amount?`<dt>금액</dt><dd><b class="num">${won(a.amount)}</b>원</dd>`:''}${r?`<dt>연결 문서</dt><dd><button class="lnk" data-ref>${esc(ENT[a.ref.k].n)} ${esc(r.no||r.name||'')}</button> ${pill(r.status)}</dd>`:''}</dl>
   ${a.body?`<div class="note" style="color:var(--fg);white-space:pre-wrap">${esc(a.body)}</div>`:''}
   ${B.length?`<form class="form" id="apf"><label for="apm">의견 <span class="pmeta">(반려 · 회수 시 필수)</span><textarea id="apm"></textarea></label><div class="actions" style="justify-content:flex-start">${B.map(([n,c])=>`<button type="button" class="btn ${c}" data-ap="${n}">${n}</button>`).join('')}</div>${apprCanAct(a)&&a.line[a.step].emp!==S.user.emp?'<p class="pmeta">관리자 권한으로 대리 결재합니다.</p>':''}</form>`:''}
   ${R.length?admBar(R.map(n=>`<button class="btn sm" data-ap="${n}">${n}</button>`).join(''),'되돌리기 (관리자)'):''}
   <div><h3 class="h3">결재 이력</h3><div class="tl">${a.log.slice().reverse().map((l,i)=>`<div class="it ${i===0?'last':''}"><div class="when num">${l[0]}</div>${esc(l[1])}</div>`).join('')}</div></div>`);
  const done=()=>{d.remove(); re&&re(); if(S.view==='appr') renderView()};
  $('[data-ref]',d)&&($('[data-ref]',d).onclick=()=>{d.remove(); openDetail(a.ref.k,a.ref.id,re)});
  $$('[data-ap]',d).forEach(b=>b.onclick=()=>{const act=b.dataset.ap; const memo=($('#apm',d)?.value||'').trim();
    if(['반려','회수'].includes(act)&&!memo){$('#apm',d).focus(); toast('의견을 입력하세요.'); return}
    if(['승인 취소','반려 취소'].includes(act)) return ask(act,`${a.no} 결재를 되돌립니다.`,act,why=>{apprAct(a,act,why);done();toast(act+' 처리했습니다.')},true);
    apprAct(a,act,memo); done(); toast(`${act} 처리했습니다.`)})}

/* ---------- 자동 로그아웃 ---------- */
let idleT,warnT,cdT,lastAct=Date.now();
const IDLE_MS=()=>$('#fastIdle')?.checked?30000:30*60000, WARN_MS=()=>$('#fastIdle')?.checked?10000:120000;
const EVS=['mousemove','keydown','click','touchstart','scroll','wheel'];
function startIdle(){stopIdle(); lastAct=Date.now(); EVS.forEach(ev=>addEventListener(ev,onAct,{passive:true})); tick()}
function stopIdle(){clearTimeout(idleT);clearTimeout(warnT);clearInterval(cdT);EVS.forEach(ev=>removeEventListener(ev,onAct));$('#idleM')?.remove()}
function onAct(){ if($('#idleM')) return; lastAct=Date.now(); tick() }
function tick(){clearTimeout(idleT);clearTimeout(warnT); warnT=setTimeout(showWarn,IDLE_MS()-WARN_MS()); idleT=setTimeout(()=>{stopIdle();$$('.scrim').forEach(x=>x.remove());logout('30분 동안 사용하지 않아 자동 로그아웃되었습니다.')},IDLE_MS())}
function showWarn(){const d=document.createElement('div');d.className='scrim center';d.id='idleM';

function enterApp(u){ S.user={id:u.id,emp:u.emp,name:byId('emp',u.emp)?.name||u.name,roles:u.roles,ext:u.ext}; S.view=u.ext?'portal':'home'; u.last=STAMP(); audit('user',u.id,'로그인',''); save(); renderApp(); startIdle(); if(CLOUD){ cloudRealtime(); if(u.pwTemp) openPwChange(true) } }
async function login(id,pw){ const m=$('#lmsg'), set=(t,c='err')=>{m.textContent=t;m.className='msg '+c};
  if(!id||!pw) return set('아이디와 비밀번호를 모두 입력하세요.');
  if((S.lock[id]||0)>Date.now()) return set(`비밀번호를 5회 틀려 잠겼습니다. ${Math.ceil((S.lock[id]-Date.now())/60000)}분 후 다시 시도하거나 인사팀에 해제를 요청하세요.`);
  const fail=()=>{ S.fails[id]=(S.fails[id]||0)+1; if(S.fails[id]>=5){S.lock[id]=Date.now()+15*60000;S.fails[id]=0;return set('비밀번호를 5회 틀려 15분 동안 잠겼습니다.')} return set(`아이디 또는 비밀번호가 맞지 않습니다. (${S.fails[id]}/5회)`)};
  let u;
  if(CLOUD){ set('확인 중…','info'); const btn=$('.lg-go'); if(btn) btn.disabled=true; const r=await cloudLogin(id,pw); if(btn) btn.disabled=false; if(r.fail) return fail(); if(r.msg) return set(r.msg,r.type||'err'); u=r.u }
  else { u=T('user').find(x=>x.id===id);
    if(!u){ const sr=T('signup').filter(x=>x.uid===id).pop(); if(sr&&sr.status==='대기') return set('가입 승인 대기 중입니다. 승인 후 로그인할 수 있습니다.','info'); if(sr&&sr.status==='반려') return set('가입이 반려되었습니다: '+(sr.why||'')) }
    if(u&&!u.on) return set('사용이 중지된 계정입니다. 인사팀에 문의하세요.');
    if(!u||u.pw!==pw) return fail() }
  S.fails[id]=0; const nm=empName(u.emp)||u.name; lsSet('ayon.recent',[{id,name:nm},...recent().filter(x=>x.id!==id)].slice(0,3));
  $('.lg')?.classList.add('going');
  setTimeout(()=>enterApp(u),480)}

/* 변경 이력 */
VIEWS.audit=el=>{ const q=S.aq||''; const rows=DB.audit.filter(a=>!q||(a.act+a.detail+a.by+(ENT[a.ent]?.n||a.ent)).includes(q)).slice(0,300);
  el.innerHTML=head('변경 이력','시스템','모든 등록 · 수정 · 삭제 · 상태 처리 · 로그인 기록. 지울 수 없습니다.')+`<section class="panel"><div class="hd"><div class="filters"><input id="aq" placeholder="내용 · 사람 · 메뉴 검색" value="${esc(q)}" aria-label="검색"></div><span class="pmeta">최근 ${rows.length}건</span></div><div class="tw"><table class="t"><thead><tr><th>시각</th><th>사람</th><th>메뉴</th><th>처리</th><th>내용</th></tr></thead><tbody>${rows.map(a=>`<tr><td class="num nw" style="font-size:12px">${a.at}</td><td class="nw">${esc(a.by)}</td><td class="nw">${esc(ENT[a.ent]?.n||({user:'사용자',appr:'전자결재'})[a.ent]||a.ent)}</td><td class="nw"><b>${esc(a.act)}</b></td><td style="font-size:12px">${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">기록이 없습니다.</td></tr>'}</tbody></table></div></section>`;
  const i=$('#aq',el); i.oninput=()=>{S.aq=i.value; VIEWS.audit(el); const n=$('#aq',el); n.focus(); n.setSelectionRange(n.value.length,n.value.length)} };

VIEWS.cfg=el=>{ el.innerHTML=head('설정 · 데이터','시스템','')+`<div class="cardgrid">

  $('#cf1',el).onsubmit=e=>{e.preventDefault(); DB.cfg.apprCeo=+$('#c1',el).value; DB.cfg.ctAlert=+$('#c2',el).value; DB.cfg.weeklyDue=$('#c3',el).value; audit('cfg','cfg','설정 변경'); save(); toast('저장했습니다.')};
  const reset=full=>{ const me=CLOUD?T('user').find(u=>u.id===S.user.id):null; const meEmpRec=me?byId('emp',me.emp):null; DB=seed(full);
    if(CLOUD&&me&&!T('user').some(u=>u.id===me.id)){ const e=T('emp').find(x=>x.email===me.id)||T('emp').find(x=>x.name===meEmpRec?.name); T('user').push({...me,emp:e?e.id:me.emp,roles:[...new Set([...(me.roles||[]),'R-ADMIN'])],on:true}) }
    save(); logout(full?'샘플 데이터로 다시 시작했습니다.':'빈 상태로 시작했습니다. 다시 로그인하세요.') };
  $('#dSample',el)&&($('#dSample',el).onclick=()=>ask('샘플 데이터로 다시 시작','지금까지 입력한 내용이 모두 지워지고 샘플 데이터로 바뀝니다.','다시 시작',()=>reset(true)));
  $('#dEmpty',el)&&($('#dEmpty',el).onclick=()=>ask('빈 상태로 시작',CLOUD?'지금까지 입력한 내용이 모두 지워집니다. 회사 · 관리자(본인 계정)만 남습니다.':'지금까지 입력한 내용이 모두 지워집니다. 관리자 계정(yeongsooju / ay1234!)만 남습니다.','빈 상태로 시작',()=>reset(false))) };

ENT.emp={n:'직원',menu:'emp',eb:'인사',prefix:null,lead:'인사 등록 · 조회 · 수정. 직위 · 직급 · 직책 · 소속은 발령으로만 바뀝니다.',
  fields:[{k:'no',l:'사번',ro:true},{k:'name',l:'이름',req:true},{k:'email',l:'아이디 (영문이름+영문성)',req:true,unique:true,valid:v=>/^[a-z]+[0-9]?$/.test(v)?null:'아이디는 영문 소문자 이름+성입니다. 예) yeongsooju',lock:r=>!!userOfEmp(r.id),fmt:v=>`<span class="num">${esc(v)}@gcway.com</span>`},

    {k:'status',l:'재직 상태',ro:true,fmt:v=>pill(v)},{k:'leave',l:'퇴사일',t:'date',ro:true},{k:'leaveWhy',l:'퇴사 사유',ro:true}],
  cols:['no','name','org','pos','duty','join'],search:['name','no','email','phone'],sort:(a,b)=>a.no.localeCompare(b.no),
  beforeCreate:n=>{DB.seq.emp=(DB.seq.emp||0)+1; n.no='AY-'+String(DB.seq.emp).padStart(4,'0'); n.status='재직'; n.card={}; n.hist=[{d:n.join,k:'입사',v:`${orgPath(n.org)} · ${posName(n.pos)}${n.grade?' '+refName('grade',n.grade):''}`,by:S.user.name}]},
  detailExtra:r=>`<div class="actions" style="justify-content:flex-start"><button class="btn" data-card="${r.id}">인사기록카드</button>${isHR()&&r.status!=='퇴사'?`<button class="btn" data-apnew="${r.id}">발령 등록</button>`:''}${isHR()&&r.status==='재직'?`<button class="btn" data-retire="${r.id}">퇴사 처리</button>`:''}${isHR()&&r.status!=='재직'?`<button class="btn" data-unretire="${r.id}">퇴사 취소</button>`:''}</div>
   <div><h3 class="h3">발령 이력</h3><div class="tw"><table class="t"><thead><tr><th>발령일</th><th>구분</th><th>내용</th></tr></thead><tbody>${(r.hist||[]).slice().reverse().map(h=>`<tr><td class="num nw">${h.d}</td><td>${pill(h.k,{승진:'ok',승급:'ok',퇴사:'bad',입사:'done'})}</td><td style="font-size:12px">${esc(h.v)}</td></tr>`).join('')}</tbody></table></div></div>`};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-card],[data-apnew],[data-retire],[data-unretire]'); if(!b) return; const sc=b.closest('.scrim');
  if(b.dataset.card){sc&&sc.remove(); S.cardEmp=b.dataset.card; go('mycard')}
  if(b.dataset.apnew){sc&&sc.remove(); openForm('appoint',null,()=>go('appoint'),{emp:b.dataset.apnew})}
  if(b.dataset.retire){const r=byId('emp',b.dataset.retire); modal(`<h2>${esc(r.name)} 퇴사 처리</h2><div class="fgrid2"><label for="ld">퇴사일<input id="ld" type="date" value="${THIS_M}-30"></label><label for="lr">사유<select id="lr">${opts(['자발적 퇴사','권고사직','계약 만료','정년','기타'])}</select></label><label for="lm" class="wide">메모<input id="lm" placeholder="인수인계 대상 등"></label></div><p class="pmeta">퇴사일 전에는 "퇴사 예정", 퇴사일이 지나면 계정 사용 중지와 개인 권한 회수가 함께 처리됩니다. 인사 기록은 근로기준법에 따라 3년 보존합니다.</p><div class="actions"><button type="button" class="btn" data-x>취소</button><button class="btn acc">퇴사 등록</button></div>`,(f,d)=>f.onsubmit=ev=>{ev.preventDefault(); const ld=$('#ld',f).value; if(isClosed(ld)) return toast(ld.slice(0,7)+'은 마감된 달입니다.');
      r.leave=ld; r.leaveWhy=$('#lr',f).value; r.status=ld<=TODAY?'퇴사':'퇴사 예정'; r.hist.push({d:ld,k:'퇴사',v:r.leaveWhy+($('#lm',f).value?' · '+$('#lm',f).value:''),by:S.user.name});
      if(r.status==='퇴사'){const u=userOfEmp(r.id); if(u){u.on=false; DB.grant=T('grant').filter(g=>!(g.tt==='개인'&&g.tg===u.id))}}
      T('org').forEach(o=>{if(o.head===r.id&&r.status==='퇴사')o.head=null});
      audit('emp',r.id,'퇴사 등록',ld+' · '+r.leaveWhy); save(); d.remove(); sc&&sc.remove(); renderView(); toast(r.status==='퇴사'?'퇴사 처리했습니다.':'퇴사 예정으로 등록했습니다.')})}
  if(b.dataset.unretire){const r=byId('emp',b.dataset.unretire); if(isClosed(r.leave)) return toast('퇴사일이 마감된 달입니다. 마감 해제 후 취소하세요.'); ask('퇴사 취소',`${esc(r.name)}의 ${r.leave} 퇴사를 취소하고 재직으로 되돌립니다.`,'퇴사 취소',why=>{const u=userOfEmp(r.id); if(u) u.on=true; r.hist.push({d:TODAY,k:'퇴사 취소',v:r.leave+' 퇴사 취소 · '+why,by:S.user.name}); r.leave='';r.leaveWhy=''; r.status='재직'; audit('emp',r.id,'퇴사 취소',why); save(); sc&&sc.remove(); renderView(); toast('재직으로 되돌렸습니다. 개인 권한은 다시 부여해야 합니다.')},true)}
});

ENT.appoint={n:'발령',menu:'appoint',eb:'인사',prefix:'HA',lead:'승진(직위) · 승급(직급) · 보직(직책) · 전보(소속)를 결재로 확정합니다. 확정되면 직원 정보에 자동 반영되고, 취소하면 원래대로 돌아갑니다.',lockClosed:true,
  fields:[{k:'emp',l:'대상자',ref:'emp',req:true,where:e=>e.status!=='퇴사'},{k:'kind',l:'구분',t:'sel',opt:['승진','승급','보직','직책해제','전보'],req:true},{k:'date',l:'발령일',t:'date',req:true,def:TODAY},
    {k:'toPos',l:'변경 직위',ref:'pos',show:r=>!r.kind||r.kind==='승진'},{k:'toGrade',l:'변경 직급',ref:'grade',show:r=>!r.kind||['승진','승급'].includes(r.kind)},{k:'toDuty',l:'변경 직책',ref:'duty',show:r=>!r.kind||r.kind==='보직'},{k:'toOrg',l:'변경 소속',ref:'org',show:r=>!r.kind||r.kind==='전보'},
    {k:'reason',l:'근거 · 사유',t:'area'}],
  cols:['no','emp','kind','date'],search:['no','emp'],title:r=>`${refName('emp',r.emp)} ${r.kind}`,
  validate:v=>({승진:v.toPos?null:'변경 직위를 고르세요.',승급:v.toGrade?null:'변경 직급을 고르세요.',보직:v.toDuty?null:'변경 직책을 고르세요.',전보:v.toOrg?null:'변경 소속을 고르세요.',직책해제:null})[v.kind],
  editable:r=>['작성','반려'].includes(r.status),
  approval:{type:'일반 품의',title:r=>`[발령] ${refName('emp',r.emp)} ${r.kind} (${r.date})`,amount:()=>0},
  flow:{init:'작성',steps:['작성','결재중','확정'],extra:['반려','취소'],approvedTo:'확정',
    onApproved:r=>applyAppoint(r),onUnapproved:r=>revertAppoint(r),
    moves:[{id:'sub',l:'결재 상신',from:['작성','반려'],approval:true,self:true},
      {id:'wd',l:'결재 회수',from:['결재중'],rev:true,self:true,run:r=>{const a=byId('appr',r.appr); if(a) apprAct(a,'회수','기안자 회수')},to:null},
      {id:'cx',l:'발령 취소 (원래대로)',from:['확정'],to:'취소',rev:true,check:r=>isClosed(r.date)?'마감된 달의 발령은 취소할 수 없습니다.':null,run:r=>revertAppoint(r)},
      {id:'del2',l:'작성 취소',from:['작성','반려'],to:'취소',rev:true,self:true},{id:'re',l:'다시 작성',from:['취소'],to:'작성',rev:true,guard:r=>!r.applied}]}};
function applyAppoint(r){const e=byId('emp',r.emp); const f=APK[r.kind]; r.before={pos:e.pos,grade:e.grade,duty:e.duty,org:e.org};
  if(r.kind==='승진'){e.pos=r.toPos; if(r.toGrade) e.grade=r.toGrade} else if(r.kind==='승급') e.grade=r.toGrade; else if(r.kind==='보직') e.duty=r.toDuty; else if(r.kind==='직책해제') e.duty=''; else if(r.kind==='전보') e.org=r.toOrg;
  const desc={승진:`${posName(r.before.pos)} → ${posName(e.pos)}`,승급:`${refName('grade',r.before.grade)||'-'} → ${refName('grade',e.grade)}`,보직:`${dutyName(r.before.duty)||'없음'} → ${dutyName(e.duty)}`,직책해제:`${dutyName(r.before.duty)} 해제`,전보:`${orgPath(r.before.org)} → ${orgPath(e.org)}`}[r.kind];
  e.hist.push({d:r.date,k:r.kind,v:desc+(r.reason?' · '+r.reason:''),by:r.no,ap:r.id}); r.applied=true; audit('emp',e.id,'발령 반영',r.kind+' '+desc)}
function revertAppoint(r){ if(!r.applied) return; const e=byId('emp',r.emp); Object.assign(e,r.before); e.hist.push({d:TODAY,k:'발령 취소',v:`${r.no} ${r.kind} 취소`,by:S.user.name}); r.applied=false; audit('emp',e.id,'발령 취소',r.no)}

/* 직위 · 직급 · 직책 */
VIEWS.hrcode=el=>{const tab=S.ctab||'직위'; const top=`<div class="chips tabs">${['직위','직급','직책'].map(t=>`<button class="chip ${tab===t?'on':''}" data-ct="${t}">${t}</button>`).join('')}</div><p class="note" style="margin-bottom:12px">직위 = 서열(승진으로 바뀜) · 직급 = 직위 안의 단계(승급으로 바뀜) · 직책 = 조직을 맡는 역할(보직으로 바뀜). 쓰고 있는 코드는 삭제 대신 사용 중지합니다. 기준은 아직 확정 전이므로 자유롭게 등록 · 수정 · 삭제할 수 있습니다.</p>`;
  const k={직위:'pos',직급:'grade',직책:'duty'}[tab]; renderList(k,el,{top,after:()=>$$('[data-ct]',el).forEach(b=>b.onclick=()=>{S.ctab=b.dataset.ct;VIEWS.hrcode(el)})}); $('.ph h1',el).textContent='직위 · 직급 · 직책'};

/* 조직관리 · 조직도 */
VIEWS.org=el=>{ const tab=S.otab||'조직도';
  const top=`<div class="chips tabs">${['조직도','목록'].map(t=>`<button class="chip ${tab===t?'on':''}" data-ot="${t}">${t}</button>`).join('')}</div>`;
  const bind=()=>$$('[data-ot]',el).forEach(b=>b.onclick=()=>{S.otab=b.dataset.ot;VIEWS.org(el)});
  if(tab==='목록'){ renderList('org',el,{top,after:bind}); $('.ph h1',el).textContent='조직관리 · 조직도'; return }

function annual(e){const y=(new Date(TODAY)-new Date(e.join))/864e5/365; if(y<1) return Math.min(11,Math.floor(y*12)); return Math.min(25,15+Math.floor((Math.floor(y)-1)/2))}
function usedLeave(empId){return T('leave').filter(l=>l.emp===empId&&l.status==='승인'&&l.from.slice(0,4)===TODAY.slice(0,4)&&['연차','오전 반차','오후 반차'].includes(l.kind)).reduce((a,l)=>a+(+l.days||0),0)}

function inM(d,m){return d&&d.slice(0,7)===m}
function plCalc(m,dim){ const groups={}; const G=k=>groups[k]||(groups[k]={sales:0,cogs:0,fee:0,ad:0,logi:0,sga:0,labor:0});
  const key=(corp,brand)=>dim==='brand'?(brand||'공통'):dim==='team'?(byId('brand',brand)?.team||'공통'):(corp||'공통');
  T('sale').filter(s=>['출고완료','정산완료'].includes(s.status)&&inM(s.date,m)).forEach(s=>{const tot=lineTotal(s.lines)||1; s.lines.forEach(l=>{const it=byId('item',l.item); const g=G(key(s.corp,it?.brand)); const amt=l.qty*l.price; g.sales+=amt; g.cogs+=(l.cost||0)*l.qty; g.fee+=Math.round(amt*(+s.feeRate||0)/100)})});
  T('expense').filter(x=>['승인','지급완료'].includes(x.status)&&inM(x.date,m)).forEach(x=>{const a=byId('acct',x.acct); const g=G(key(x.corp,x.brand)); const c=a?.cat; const v=+x.amount||0; if(c==='광고비')g.ad+=v; else if(c==='물류비')g.logi+=v; else if(c==='인건비')g.labor+=v; else if(c==='판매수수료')g.fee+=v; else if(c!=='영업외')g.sga+=v});
  T('pladj').filter(x=>x.month===m).forEach(x=>{const a=byId('acct',x.acct); const g=G(key(x.corp,x.brand)); const c=a?.cat; const v=+x.amount||0; if(c==='광고비')g.ad+=v; else if(c==='인건비')g.labor+=v; else if(c==='물류비')g.logi+=v; else g.sga+=v});
  const fin=g=>{g.gp=g.sales-g.cogs; g.cm=g.gp-g.fee-g.ad-g.logi; g.op=g.cm-g.sga-g.labor; return g};
  Object.values(groups).forEach(fin); const tot=fin(Object.values(groups).reduce((a,g)=>{for(const k of ['sales','cogs','fee','ad','logi','sga','labor'])a[k]+=g[k];return a},{sales:0,cogs:0,fee:0,ad:0,logi:0,sga:0,labor:0}));
  return {groups,tot}}
